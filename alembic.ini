; alembic-Konfiguration (M1 Welle 6c).
;
; `script_location` zeigt auf das Adapter-spezifische Migrations-
; Verzeichnis — `runs`-Schema gehoert in den Postgres-Adapter,
; nicht in einen Repo-Root-Sammeltopf.
;
; `sqlalchemy.url` wird zur Laufzeit per Env-Var oder
; `alembic.context.config.set_main_option` ueberschrieben
; (Integration-Tests injizieren den testcontainers-DSN).

[alembic]
script_location = src/grid_gym/adapters/driven/persistence_postgres/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
