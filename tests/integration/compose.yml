# Integration-Test-Stack (M1 Welle 6c, Trigger 009).
#
# `test-runner` baut den `source`-Stage des Dockerfiles und ruft
# pytest gegen `tests/integration/` auf. testcontainers spawnt
# Sibling-Container ueber den gemounteten Docker-Socket — kein
# docker-in-docker, kein eigener Service hier (siehe
# `deploy/compose.yml` fuer den Production-Stack).
#
# Per Welle aktive Siblings (alle via testcontainers gespawnt,
# nicht hier deklariert):
# - Postgres (M1 Welle 6c, Trigger 009) fuer `RunRepositoryPort`.
# - otel-collector (M3 Welle 6, ADR 0024 §4.5.7) fuer den
#   OTLP-Compose-Smoke (`test_otlp_compose_smoke.py`).
# - Mosquitto (M4 Welle 2, ADR 0031) fuer den MQTT-Smoke
#   (`test_mqtt_compose_smoke.py`; eclipse-mosquitto:2 mit
#   inline-Config fuer Anonymous-Access; EPL-2.0/EDL-1.0).
#
# M4 Welle 3 (ADR 0032 §2.6 Decision M-f) **weicht ab**: der
# Modbus-TCP-Smoke (`test_modbus_in_process_smoke.py`) spawnt
# **keinen** Sibling-Container, sondern einen pymodbus-Server
# in einem Daemon-Thread innerhalb des Test-Prozesses (Lizenz-
# Pragmatik: kommerziell-restriktive Modbus-Server-Container
# vermeiden; pymodbus selbst ist BSD-3-Clause).
#
# M4 Welle 4 (ADR 0033 §2.5 Decision O-e) folgt der Welle-3-
# Praezedenz: der OPC-UA-Smoke (`test_opcua_in_process_smoke.py`)
# spawnt einen `asyncua.Server` in einem eigenen asyncio-Loop-
# Thread innerhalb des Test-Prozesses, **kein** Sibling-Container.
# asyncua ist LGPL-3.0 fuer Library-Linking; `open62541/open62541`-
# Image waere MPL-2.0 mit nicht-trivialer Container-Config gewesen.
#
# M4 Welle 5a (ADR 0034 §2.5 Decision D-e) zieht das Pattern fort:
# der DNP3-Smoke (`test_dnp3_in_process_smoke.py`) spawnt
# `dnp3_outstation.AsyncOutstation` in einem eigenen asyncio-Loop-
# Thread, **kein** Sibling-Container. **Zwei-Library-Setup:** Master
# via `nfm-dnp3` (PyPI, MIT, Pure-Python) als `[project] dependencies`;
# Outstation via `dnp3-outstation` (PyPI, MIT, Pure-Python, asyncio-
# native, IEEE-1815-2012-Level-1-Subset) nur als
# `[dependency-groups.dev]`. Wire-Compat zwischen den beiden Libraries
# wurde per C1-Probe verifiziert (Class-0-Polling-Read; qualifier 0x01
# inkompatibel — siehe ADR 0034 §1 + §3 A4). Pattern bleibt fuer
# Welle 5b (IEC-61850) verfuegbar.
#
# Aufruf: `make test-integration` (Makefile-Target, das `docker
# compose up --abort-on-container-exit` aufruft).

services:
  test-runner:
    build:
      # `context: ../..` macht das Repo-Root zum Build-Context;
      # `dockerfile: Dockerfile` ist relativ dazu.
      context: ../..
      dockerfile: Dockerfile
      target: source
    command:
      - uv
      - run
      - pytest
      - tests/integration/
      - -v
    volumes:
      # testcontainers braucht Docker-Socket-Zugriff, um ephemere
      # Container zu spawnen.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # testcontainers-spezifisch: erzwingt Sibling-Container-
      # Modus (statt Docker-in-Docker).
      TESTCONTAINERS_RYUK_DISABLED: "true"
