# Integration-Test-Stack (M1 Welle 6c, Trigger 009;
# konsolidiert in M4-Welle-6a-C3 2026-06-01).
#
# `test-runner` baut den `source`-Stage des Dockerfiles und ruft
# pytest gegen `tests/integration/` auf. testcontainers spawnt
# Sibling-Container ueber den gemounteten Docker-Socket — kein
# docker-in-docker, kein eigener Service hier (siehe
# `deploy/compose.yml` fuer den Production-Stack).
#
# ============================================================
# Sibling-Inventar (alle via testcontainers gespawnt, nicht
# hier deklariert)
# ============================================================
#
# CONTAINER-Siblings (echte Docker-Images):
#
# | Welle      | Sibling         | Image                            | Lizenz       | Test                                    |
# | ---------- | --------------- | -------------------------------- | ------------ | --------------------------------------- |
# | M1 6c     | postgres        | postgres:16-alpine               | PostgreSQL   | test_postgres_run_repository.py         |
# | M3 6      | otel-collector  | otel/opentelemetry-collector:0.x | Apache-2.0   | test_otlp_compose_smoke.py              |
# | M4 2      | mosquitto       | eclipse-mosquitto:2              | EPL-2.0      | test_mqtt_compose_smoke.py              |
#
# IN-PROCESS-Siblings (Server laeuft im Test-Prozess; kein
# Container-Spawn; Decision-Praezedenz Welle-3-M-f, Welle-4-O-e,
# Welle-5a-D-e, Welle-5b-I-e):
#
# | Welle      | Sibling                              | Library              | Lizenz   | Test                                       |
# | ---------- | ------------------------------------ | -------------------- | -------- | ------------------------------------------ |
# | M4 3      | pymodbus-Server (Daemon-Thread)      | pymodbus 3.x         | BSD-3    | test_modbus_in_process_smoke.py            |
# | M4 4      | asyncua.Server (asyncio-Loop-Thread) | asyncua 1.2b2        | LGPL-3.0 | test_opcua_in_process_smoke.py             |
# | M4 5a     | dnp3_outstation.AsyncOutstation      | dnp3-outstation 0.2  | MIT      | test_dnp3_in_process_smoke.py              |
# | M4 5b     | pyiec61850.server.IedServer          | pyiec61850-ng 1.6.x  | **GPLv3** | test_iec61850_in_process_smoke.py (skip)  |
#
# **Welle-5b-Sonderfall (ADR 0035 Decision I-e + I-f):**
# IEC-61850-Smoke laeuft aktuell unter **2c-Mock-only-Fallback**
# (Python-3.14-SWIG-Inkompat des `pyiec61850-ng`-Wheels). Der
# Test ist via `pytest.mark.skip` deaktiviert; Mock-Unit-Tests
# decken den Vertrag ab. Welle-6b adressiert Reaktivierung
# (Python-3.12-Runtime / Library-Upgrade / Wheel-Rebuild).
#
# **GPL-Lizenz-Boundary (ADR 0035 Decision I-f):** das
# `pyiec61850-ng` Sibling-Wheel ist GPLv3; `protocol_iec61850/*`
# + zugehoerige Tests sind via SPDX-Header GPL-3.0-isoliert.
# `pyiec61850-ng` ist `[project.optional-dependencies.iec61850]`
# (opt-in via `pip install grid-gym[iec61850]`). Im Dockerfile
# wird das Extra ueber `uv sync --extra iec61850` in deps/source/
# build-app-Stages installiert (Welle-5b-Slice-033-Fix).
#
# **Lizenz-Pragmatik fuer in-process-Wahl** (gegen Container-
# Sibling): kommerziell-restriktive Modbus-/IEC-61850-Server-
# Container vermeiden; `open62541/open62541`-Image (MPL-2.0)
# braucht non-triviale Config; in-process-Pattern bringt
# pymodbus/asyncua/dnp3-outstation/pyiec61850 als Python-
# Wheels rein, keine Container-Pull-Latenz.
#
# Aufruf: `make test-integration` (Makefile-Target, das `docker
# compose up --abort-on-container-exit` aufruft).

services:
  test-runner:
    build:
      # `context: ../..` macht das Repo-Root zum Build-Context;
      # `dockerfile: Dockerfile` ist relativ dazu.
      context: ../..
      dockerfile: Dockerfile
      target: source
    command:
      - uv
      - run
      - pytest
      - tests/integration/
      - -v
    volumes:
      # testcontainers braucht Docker-Socket-Zugriff, um ephemere
      # Container zu spawnen.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # testcontainers-spezifisch: erzwingt Sibling-Container-
      # Modus (statt Docker-in-Docker).
      TESTCONTAINERS_RYUK_DISABLED: "true"
