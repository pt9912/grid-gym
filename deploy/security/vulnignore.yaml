# Vulnerability-Ignore-Liste (Audit-Source-of-Truth) fuer
# `make image-audit` (Trivy) und kuenftige `make vuln-check`-
# Substanz.
#
# Pattern-Verankerung: ADR 0044 (Generated-Trivyignore-Permit aus
# strukturierter Audit-Source-of-Truth; M6 Welle 4a) — ADR-0011-
# Schaerfung an ADR-0043 §2.2. Jeder Eintrag braucht eine knappe
# Begruendung plus Pflicht-`expires` (max. +90 Tage) und Pflicht-
# `scope`.
#
# Schema (Trivy-kompatibel):
#
#   trivy:
#     # CVE-Liste, die Trivy ignorieren soll.
#     ignore:
#       - id: CVE-YYYY-NNNNN
#         reason: "knappe Begruendung mit Vektor-Aussage"
#         expires: YYYY-MM-DD
#         scope: "image-name oder *"
#
#   govulncheck:
#     # GO-VULN-Liste, die govulncheck als not-affected behandeln soll.
#     # Hinweis: grid-gym hat keinen govulncheck-Lauf (Go-Code-Scan
#     # nicht Teil der Audit-Surface; siehe ADR-0044 §7). Block
#     # bleibt als Schema-Treue-Stub vorhanden, wird aber nicht
#     # ausgewertet.
#     ignore: []
#
# Wartungsregel:
#   - `id` + `reason` + `expires` + `scope` sind Pflicht-Felder
#     (ADR-0044 §2.2). Eintraege mit fehlendem Feld brechen den
#     Render-Lauf mit EXIT=1 unabhaengig vom Scope-Filter.
#   - `expires` Default 90 Tage; danach muss der Eintrag erneuert
#     oder entfernt werden.
#   - Bei `expires`-Ueberschreitung bricht `make render-trivyignore`
#     (laeuft `uv run python tools/render_trivyignore.py --scope
#     $(TRIVYIGNORE_SCOPE)` im docker-source-Stage) mit Fehlermeldung;
#     das Upgrade- oder Begruendungs-Update gehoert in einen Folge-
#     Commit (Pattern analog Welle-3-Post-Closure-Korrektur-Stack-
#     Erweiterung).
#   - Begleit-`open/`-Trigger ist Pflicht per ADR-0043 §2.2 +
#     ADR-0044 §2.1: jeder Eintrag braucht einen Trigger-Doc, der
#     den echten Aufloesungs-Pfad verankert (vulnignore-Form ist
#     Temp-Deferral, nicht Aufloesungs-Substanz).
#   - Render-Output `.trivyignore` ist NICHT versioniert
#     (`.gitignore`-Eintrag); diese YAML-Datei ist die kanonische
#     Quelle.

trivy:
  # Aktiver Temp-Deferral (ADR 0044): CVE-2026-39822 im OTel-Collector-
  # Sidecar (Go-stdlib go1.26.4, fix in go1.26.5) — kein gepatchtes
  # Collector-Image upstream (0.155/0.156 weiter go1.26.4). Aufloesungs-
  # Pfad = Trigger 065 (Bump auf erste Stable mit go1.26.5, dann Eintrag
  # entfernen). Historie: der vorige Eintrag CVE-2026-42504 wurde
  # 2026-06-18 durch den 0.154.0-Bump aufgeloest (Trigger 033 -> done/).
  ignore:
    - id: CVE-2026-39822
      reason: "Go stdlib os.Root Symlink-Following / Directory-Traversal (HIGH, fix in go1.26.5); otel/opentelemetry-collector-contrib:0.154.0 gobinary linked gegen go1.26.4; OTel-Collector ist Compose-internes Sibling ohne untrusted-Filesystem-/os.Root-Pfad; Temp-Deferral bis OTel-Stable mit go1.26.5+ (0.155/0.156 weiter go1.26.4, 0.157.0 bislang nur nightly). Begleit-Trigger 065."
      expires: 2026-10-09
      scope: "otel-collector"

govulncheck:
  ignore: []
