# Optionaler Ports-Override fuer `compose.bess-ems-sut.yml` (Slice 077 S3).
#
# Mappt die beiden Web-UIs auf den Host, damit man sie im Browser ansehen kann —
# der Basis-Compose ist bewusst **port-los** (der log-getriebene E2E
# `scripts/bess-ems-sut-e2e.sh` braucht keine Host-Ports; er verifiziert ueber das
# interne Netz + Container-Logs, und port-los vermeidet 1883/8080-Kollisionen).
#
# Nur fuer die manuelle Ansicht dazuschalten:
#
#   docker compose -f deploy/compose.bess-ems-sut.yml \
#                  -f deploy/compose.bess-ems-sut.ports.yml up
#
# Dann:
#   - grid-gym Web-UI (HTMX):        http://localhost:8000
#       Dashboard: http://localhost:8000/runs/demo-run-0001/dashboard
#       (Szenario `bess-ems-sut.yaml` → Batterie `single-bess-1`)
#   - bess-ems Operator-Konsole:      http://localhost:8080/operator/
#       Health: http://localhost:8080/health
#     Der Basis-Compose (E2E-Harness) laeuft headless und braucht KEINEN Token.
#     Fuer die Konsole schaltet dieser Override den in bess-ems' eigenem
#     `deploy/compose.yml` + Anwenderhandbuch (§2) dokumentierten **oeffentlichen
#     Dev-Token** `dev-operator-token` (Rolle `operator`) frei — nur damit die
#     schreibende Aktion „Operator-Stop" nutzbar ist (Feld **Operator token** in der
#     Konsole). Nur-Sim, kein echtes Secret (steht so in bess-ems' Repo/Doku).
services:
  grid-gym:
    ports:
      - "8000:8080"
  bess-ems:
    ports:
      - "8080:8080"
    environment:
      ApiTokens__Tokens__0__Token: dev-operator-token
      ApiTokens__Tokens__0__Operator: operator-1
      ApiTokens__Tokens__0__Role: operator
