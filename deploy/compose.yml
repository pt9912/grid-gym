# Production-Stack (M1 Welle 6c Trigger 010 + M3 Welle 6 C2).
#
# Vier Services:
# - `postgres`: Datenbank fuer `RunRepositoryPort`-Persistenz.
# - `api`: FastAPI-uvicorn-Server; bind auf `:8080`, healthcheck
#   ueber `/health`.
# - `simulation`: heute Stub-Container (M2-Geraetemodelle bringen
#   den TickLoop-Runner). Bleibt vorerst als `sleep infinity`
#   im Stack, damit die `make runtime`-Smoke-Stage einen
#   Service mit `restart=on-failure` hat.
# - `otel-collector` (M3 Welle 6 C2): OTLP-gRPC-Collector-Sibling
#   fuer die telemetry_otlp-Adapter (`OtlpLogAdapter`/
#   `OtlpMetricsAdapter`/`OtlpTraceAdapter`). Image-Pin via
#   `${OTEL_COLLECTOR_IMAGE}`-Env-Var (Makefile-Default
#   `otel/opentelemetry-collector-contrib:0.152.1`). Image ist
#   distroless (`gcr.io/distroless/static-debian12:nonroot`) —
#   kein in-container healthcheck-Block, weil weder wget noch
#   nc noch shell vorhanden sind. Statt dessen lauscht der
#   Collector ueber die `health_check`-Extension auf :13133
#   (siehe `otel-collector-config.yaml`); `make runtime` pollt
#   diesen Endpunkt extern via Python aus dem `api`-Container.
#
# Aufruf: `make runtime` (baut Image + ruft `docker compose up`
# auf). `/health` wird vom Makefile gepollt, bis 200 kommt;
# anschliessend wird `otel-collector:13133/` extern gepollt.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grid_gym
      POSTGRES_USER: grid_gym
      POSTGRES_PASSWORD: grid_gym
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid_gym"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    # Welle-6-C2: OTLP-gRPC-Sibling fuer telemetry_otlp-Adapter.
    # Image-Tag-Default kommt aus `OTEL_COLLECTOR_IMAGE` im
    # Makefile (`export OTEL_COLLECTOR_IMAGE`); Override per
    # Env-Var moeglich. Compose interpoliert `${VAR:-default}`
    # selbst, damit `docker compose -f deploy/compose.yml up`
    # ohne Makefile auch funktioniert.
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.152.1}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    # Sink-Verzeichnis als tmpfs — Default-Profil ohne
    # Persistenz. `mode=1777` (world-writable, sticky-bit) ist
    # Pflicht, weil das distroless-Image als `nonroot`-User
    # (uid 65532) laeuft und ohne explizite Permissions im
    # default-root-owned tmpfs den `file`-Exporter mit
    # „permission denied" am Pipeline-Start crashen liesse.
    tmpfs:
      - /var/log/otel:mode=1777
    # Kein healthcheck-Block: distroless Image, keine Probe-Binary
    # vorhanden. Echte Liveness pollt `make runtime` extern via
    # Python aus dem `api`-Container gegen :13133.

  api:
    image: grid-gym-runtime:latest
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        # service_started (nicht service_healthy), weil der
        # Collector-Container distroless ist und kein in-container
        # healthcheck-Binary (wget/nc/sh) hat — siehe die
        # Begruendung im `otel-collector`-Service-Block oben.
        # Liveness pollt `make runtime` extern via
        # `tools/wait_otel_collector.py` gegen
        # `http://otel-collector:13133/` (`health_check`-Extension).
        # Der `api`-Container nutzt heute den Null-Adapter (Welle 5)
        # und wuerde Adapter-Aktivierung erst per Folge-Slice
        # bekommen — die `depends_on`-Kopplung sorgt nur fuer
        # die Boot-Reihenfolge, falls die Adapter-Verkabelung
        # spaeter aktiv wird.
        condition: service_started
    environment:
      GRID_GYM_DATABASE_URL: postgresql://grid_gym:grid_gym@postgres:5432/grid_gym
      GRID_GYM_HOST: 0.0.0.0
      GRID_GYM_PORT: "8080"
      # Welle-6-C2: OTLP-Endpoint-Default (ADR 0024 §4.5.7).
      # Per Compose-Sibling-Hostname; gRPC-Pin im Adapter-
      # Config (Allow-List `{"grpc"}`).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: grid-gym-api
    ports:
      - "8080:8080"
    # Dockerfile-`ENTRYPOINT` startet `uvicorn` direkt (Trigger 015,
    # M2 Welle 0b: shebang-Rewrite und uv-`--no-editable` haben die
    # Welle-6d-`entrypoint: []` + `python -m uvicorn`-Indirection
    # ueberfluessig gemacht). Kein `command:`-Override hier.

  simulation:
    image: grid-gym-runtime:latest
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      GRID_GYM_DATABASE_URL: postgresql://grid_gym:grid_gym@postgres:5432/grid_gym
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: grid-gym-sim
    # Welle 6c: kein produktiver TickLoop-Runner — M2-Geraete
    # bringen das. `sleep infinity` haelt den Service am Leben,
    # damit `make runtime`-Compose-Smoke ihn als running-Container
    # findet. `entrypoint: []` neutralisiert den Dockerfile-
    # `ENTRYPOINT` (uvicorn) bewusst — das Stub-Modell ist kein
    # Webserver. M2-Geraete-Runner ersetzen den Stub.
    entrypoint: []
    command: ["sleep", "infinity"]
    # Dockerfile-HEALTHCHECK pollt `/health` ueber curl. Der
    # `sleep infinity`-Stub-Container hat keinen Webserver —
    # Healthcheck per `test: ["NONE"]` deaktivieren, damit
    # docker compose ihn nicht als unhealthy verwirft. M2-
    # Geraete-Runner bringen den produktiven Healthcheck zurueck.
    healthcheck:
      test: ["NONE"]
