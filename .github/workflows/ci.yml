# grid-gym CI — vier Pflicht-Gates (Trigger 025, eroeffnet 2026-05-21).
#
# Die vier Gates laufen parallel als separate Docker-Build-Targets.
# Jeder Job baut nur den Stage, den er prueft — keine Aggregator-
# Stage (kein Cross-Job-Skip). Reihenfolge in der Job-Liste ist
# nur Anzeige-Reihenfolge; GitHub-Actions startet alle parallel.
#
# Welle-4a-Review-Folge N-2 (2026-05-22): die Jobs nutzen
# `docker/build-push-action@v6` statt `make <target>` direkt,
# damit jeder Stage einen scope-isolierten GHA-Layer-Cache
# (`cache-from`/`cache-to: type=gha`) bekommt. Funktional bleibt
# der Build identisch zum `make <target>` (Makefile ruft denselben
# `docker build --target <stage>` mit gleichen Cache-freien
# Build-Args); Aenderungen an einem Makefile-Target muessen hier
# nachgezogen werden.
#
# Bezug:
# - Trigger-Doc: docs/plan/planning/in-progress/025-github-actions-four-gates.md
# - Dockerfile-Stages: lint, arch-check-imports, arch-check-custom, typecheck
# - Makefile-Targets:  make lint, make arch-check-imports, make arch-check-custom, make typecheck
# - ADR 0002 §A-1 (Architektur-Tabus, die `arch-check-imports`-Stage enforct).
# - ADR 0005 (`mypy --strict` als Pflicht-Gate).

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel-in-Progress nur fuer Pull-Request-Runs. Bei Push auf `main`
# bleibt jeder Commit ein eigener, vollstaendiger CI-Run, damit jeder
# Main-Commit einen verlaesslichen Status traegt (Welle-4a-Review-
# Folge N-3, 2026-05-22). Pull-Requests duerfen weiter cancellen, weil
# nur der letzte Push-Zustand des PRs final entscheidend ist.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-Permissions: read-only auf `contents`. Jeder Job, der mehr
# braucht (z. B. Cache-Write), muss es explizit anfragen.
permissions:
  contents: read

jobs:
  lint-imports:
    name: lint-imports (import-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & run arch-check-imports stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: arch-check-imports
          push: false
          load: false
          cache-from: type=gha,scope=arch-check-imports
          cache-to: type=gha,scope=arch-check-imports,mode=max

  ruff-check:
    name: ruff check (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & run lint stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lint
          push: false
          load: false
          cache-from: type=gha,scope=lint
          cache-to: type=gha,scope=lint,mode=max

  arch-check-custom:
    name: arch-check-custom (tools/arch_check.py)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & run arch-check-custom stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: arch-check-custom
          push: false
          load: false
          cache-from: type=gha,scope=arch-check-custom
          cache-to: type=gha,scope=arch-check-custom,mode=max

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & run typecheck stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: typecheck
          push: false
          load: false
          cache-from: type=gha,scope=typecheck
          cache-to: type=gha,scope=typecheck,mode=max
