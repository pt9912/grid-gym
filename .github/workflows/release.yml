# grid-gym Release Workflow (Trigger 008 + GG-CICD-007 + ADR 0042; M6 Welle 2).
#
# Produziert pro Tag-Push (`v*.*.*`) oder Manual-Dispatch (verlangt
# existierendes Tag-Name als `version`-Input) sechs publizierte
# Artefakte:
#
#   1× GHCR-Push   — Container-Image runtime-Stage als
#                    `ghcr.io/<owner>/grid-gym:<tag>`. `:latest`-Alias
#                    NUR wenn der Tag-Commit der aktuelle Default-
#                    Branch-Tip ist (ADR 0042 §2.3 + Welle-2-Post-
#                    Closure-Review-Folge-3 F3-Korrektur).
#   5× Release-Assets als GitHub-Release-Asset-Files:
#      - SBOM (CycloneDX-JSON; Syft v1.17.0 gegen Runtime-Image-Digest
#        per `docker:`-Reference im Host-Daemon nach `docker pull` mit
#        GHCR-Auth; ADR 0042 §2.1 + Review-Folge-3 F1-Korrektur).
#      - JUnit-XML (Test-Reports aus test-unit-Stage).
#      - Coverage-HTML-Tarball (aus coverage-gate-Stage).
#      - OpenAPI-JSON (aus openapi-validate-Stage).
#      - Demo-Abnahme-Markdown (aus docs/user/gg-demo-008-abnahme.md).
#
# Bezug:
# - Trigger 008 (`docs/plan/planning/done/008-sbom-activation.md`;
#   in M6-Welle-2-C3 `98a1fa1` nach `done/` gewandert).
# - ADR 0042 (`docs/plan/adr/0042-sbom-tool-and-release-pattern.md`).
# - M6-Slice-Plan Welle 2 (`docs/plan/planning/done/M6-welle-2.md`;
#   in M6-Welle-2-C4a `c51d905` self-closed).
# - Trigger 032 (`docs/plan/planning/open/032-release-workflow-
#   sensor-run.md`; reale GitHub-Actions-Run-Verifikation als
#   bedingte Folge-Operation).
# - Lastenheft `GG-CICD-007` (`spec/lastenheft.md` Z.1821-1827).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must match an existing Git tag, e.g. v0.1.0). The workflow checks out the tag commit and operates on that ref.'
        required: true
        type: string

# Concurrency-Block gegen parallele Laeufe gegen denselben Tag
# (ADR 0042 §2.2). `cancel-in-progress: false` weil Release-Laeufe
# nicht abgebrochen werden duerfen — jeder Tag braucht einen vollen
# Lauf-Status.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default-Permissions: write fuer `contents` (Release-Anlage) und
# `packages` (GHCR-Push). Alle anderen Permissions auf default
# (read-only).
permissions:
  contents: write
  packages: write

jobs:
  build-and-publish-image:
    name: Build & publish Container-Image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-refs.outputs.version }}
      ref: ${{ steps.resolve-refs.outputs.ref }}
    steps:
      # F4-Korrektur (Welle-2-Post-Closure-Review-Folge-3):
      # Resolve-Refs vor Checkout, damit ALLE nachfolgenden
      # Steps gegen denselben Tag-Commit arbeiten — egal ob
      # via Tag-Push oder workflow_dispatch.
      # - Tag-Push: ref = github.ref (=refs/tags/v...), version
      #   = github.ref_name.
      # - workflow_dispatch: ref = refs/tags/${inputs.version}
      #   (verlangt existierendes Tag), version = inputs.version.
      - name: Resolve refs (version + tag ref)
        id: resolve-refs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            REF="refs/tags/$VERSION"
          else
            VERSION="${{ github.ref_name }}"
            REF="${{ github.ref }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # `fetch-depth: 0` ist Pflicht: der spaetere Default-
      # Branch-Tip-Check braucht volle Git-Historie. `ref` aus
      # resolve-refs garantiert, dass HEAD == Tag-Commit (auch
      # bei workflow_dispatch).
      - name: Checkout (resolved ref, full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-refs.outputs.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runtime image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.resolve-refs.outputs.version }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      # ADR 0042 §2.3 (Review-Folge-3 F3-Korrektur): `:latest`-
      # Tag nur wenn Tag-Commit == aktueller Default-Branch-
      # Tip-SHA (strikt; nicht nur „Vorfahre"). Ancestor-Match
      # akzeptierte sonst nachtraegliche Tags auf alten Main-
      # Commits, die `:latest` faelschlich zurueckdrehen
      # koennten. Race-Condition (Push auf Default-Branch
      # zwischen Tag-Push und Workflow-Start) toleriert: lieber
      # `:latest` nicht aktualisieren als faelschlich altes
      # Image als `:latest` zu markieren.
      - name: Check tag commit is current default branch tip
        id: tag-on-default-tip
        run: |
          git fetch origin "${DEFAULT_BRANCH}":refs/remotes/origin/default-branch
          DEFAULT_TIP_SHA=$(git rev-parse refs/remotes/origin/default-branch)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$DEFAULT_TIP_SHA" ]; then
            echo "on-default-tip=true" >> "$GITHUB_OUTPUT"
            echo "Tag commit ($HEAD_SHA) is current default branch tip; :latest will be updated."
          else
            echo "on-default-tip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag commit ($HEAD_SHA) is not the current default branch tip ($DEFAULT_TIP_SHA); :latest will NOT be updated (ADR 0042 §2.3)."
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # `:latest`-Push nur wenn Tag auf aktuellem Default-
      # Branch-Tip. Pattern: `docker buildx imagetools create`
      # setzt das Tag-Alias am Registry-Manifest direkt (kein
      # Re-Push noetig).
      - name: Tag and push :latest (default branch tip only)
        if: steps.tag-on-default-tip.outputs.on-default-tip == 'true'
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:${{ steps.resolve-refs.outputs.version }}"

      # ADR 0042 §2.1 (Review-Folge-3 F1-Korrektur): SBOM MUSS
      # gegen den gepushten Runtime-Image-Digest laufen. Syft-
      # Container ohne Docker-Credentials kann private GHCR-
      # Manifeste NICHT direkt scannen (Registry-Pull-Auth
      # fehlt). Saubere Loesung:
      # 1) `docker pull` auf dem Runner nutzt die `docker/login-
      #    action`-Credentials aus `~/.docker/config.json` und
      #    zieht das Image in den Host-Daemon.
      # 2) Syft mit `docker:`-Image-Reference (statt nacktem
      #    `ghcr.io/...`) liest das Image aus dem Host-Daemon
      #    via Socket-Mount — kein zweiter Registry-Pull,
      #    keine Auth-Frage.
      - name: Pull pushed image into local Docker daemon
        run: |
          docker pull "ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}"

      - name: Generate SBOM via Syft against local daemon image
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/artifacts":/artifacts \
            anchore/syft:v1.17.0 \
            "docker:ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}" \
            -o "cyclonedx-json=/artifacts/sbom-${{ steps.resolve-refs.outputs.version }}.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: artifacts/sbom-*.cdx.json
          if-no-files-found: error
          retention-days: 1

  produce-assets:
    name: Produce release assets (test/coverage/openapi/demo)
    runs-on: ubuntu-latest
    needs: build-and-publish-image
    steps:
      # F4-Korrektur: Checkout am gleichen Tag-Ref wie build-
      # and-publish-image — Image, Assets und Release zeigen
      # damit auf denselben Commit (auch bei workflow_dispatch).
      - name: Checkout (resolved tag ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-publish-image.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # SBOM wurde im build-and-publish-image-Job gegen den
      # gepushten Digest erzeugt (ADR 0042 §2.1). Download
      # statt zweitem lokalen Build.
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: release-sbom
          path: artifacts/

      # Lokaler Build der test-/coverage-/openapi-Stages —
      # diese Stages produzieren die anderen 4 Asset-Files.
      # Cache wird vom build-and-publish-image-Job geteilt.
      - name: Build test-unit stage & extract JUnit-XML
        run: |
          make test-unit
          docker create --name test-unit-extract grid-gym-test-unit:latest
          mkdir -p artifacts
          docker cp test-unit-extract:/src/coverage/test-results.xml \
            artifacts/test-results-${{ needs.build-and-publish-image.outputs.version }}.xml
          docker rm test-unit-extract

      - name: Build coverage-gate stage & extract HTML tarball
        run: |
          make coverage-gate
          docker create --name coverage-extract grid-gym-coverage-gate:latest
          docker cp coverage-extract:/src/coverage/htmlcov artifacts/htmlcov
          docker rm coverage-extract
          tar -czf artifacts/coverage-html-${{ needs.build-and-publish-image.outputs.version }}.tar.gz \
            -C artifacts htmlcov
          rm -rf artifacts/htmlcov

      - name: Build openapi-validate stage & extract OpenAPI-JSON
        run: |
          make openapi-validate
          docker create --name openapi-extract grid-gym-openapi-validate:latest
          docker cp openapi-extract:/src/artifacts/openapi.json \
            artifacts/openapi-${{ needs.build-and-publish-image.outputs.version }}.json
          docker rm openapi-extract

      - name: Copy demo abnahme doc as release asset
        run: |
          cp docs/user/gg-demo-008-abnahme.md \
            artifacts/gg-demo-008-abnahme-${{ needs.build-and-publish-image.outputs.version }}.md

      - name: Upload assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/
          retention-days: 1
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-publish-image, produce-assets]
    steps:
      # F4-Korrektur: Checkout am gleichen Tag-Ref —
      # `generate_release_notes: true` nutzt git log am
      # ausgecheckten Commit; ohne Tag-Ref wuerde bei
      # workflow_dispatch die Release-Notes-Generierung am
      # Default-Branch-Tip statt am Tag-Commit greifen.
      - name: Checkout (resolved tag ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-publish-image.outputs.ref }}

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-publish-image.outputs.version }}
          name: ${{ needs.build-and-publish-image.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
