# grid-gym Release Workflow (Trigger 008 + GG-CICD-007 + ADR 0042; M6 Welle 2).
#
# Produziert pro Tag-Push (`v*.*.*`) oder Manual-Dispatch sechs publizierte
# Artefakte:
#
#   1× GHCR-Push   — Container-Image runtime-Stage als `ghcr.io/<owner>/
#                    grid-gym:<tag>` + `:latest`.
#   5× Release-Assets als GitHub-Release-Asset-Files:
#      - SBOM (CycloneDX-JSON; Syft v1.17.0 gegen Runtime-Image; ADR 0042 §2.1).
#      - JUnit-XML (Test-Reports aus test-unit-Stage; ADR 0042 §2.3).
#      - Coverage-HTML-Tarball (aus coverage-gate-Stage).
#      - OpenAPI-JSON (aus openapi-validate-Stage).
#      - Demo-Abnahme-Markdown (aus docs/user/gg-demo-008-abnahme.md).
#
# Bezug:
# - Trigger 008 (`docs/plan/planning/done/008-sbom-activation.md`;
#   in M6-Welle-2-C3 `98a1fa1` nach `done/` gewandert).
# - ADR 0042 (`docs/plan/adr/0042-sbom-tool-and-release-pattern.md`).
# - M6-Slice-Plan Welle 2 (`docs/plan/planning/done/M6-welle-2.md`;
#   in M6-Welle-2-C4a `c51d905` self-closed).
# - Trigger 032 (`docs/plan/planning/open/032-release-workflow-
#   sensor-run.md`; reale GitHub-Actions-Run-Verifikation als
#   bedingte Folge-Operation).
# - Lastenheft `GG-CICD-007` (`spec/lastenheft.md` Z.1821-1827).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

# Concurrency-Block gegen parallele Laeufe gegen denselben Tag
# (ADR 0042 §2.2). `cancel-in-progress: false` weil Release-Laeufe
# nicht abgebrochen werden duerfen — jeder Tag braucht einen vollen
# Lauf-Status.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default-Permissions: write fuer `contents` (Release-Anlage) und
# `packages` (GHCR-Push). Alle anderen Permissions auf default
# (read-only).
permissions:
  contents: write
  packages: write

jobs:
  build-and-publish-image:
    name: Build & publish Container-Image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
    steps:
      # `fetch-depth: 0` ist Pflicht: der spaetere `Check tag
      # commit is on default branch`-Step braucht volle Git-
      # Historie fuer `git merge-base --is-ancestor`.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runtime image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.resolve-version.outputs.version }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      # ADR 0042 §2.3: `:latest`-Tag nur wenn Tag-Commit auf
      # Default-Branch zeigt (nicht jeder Tag-Push, da ein
      # Tag auf einem alten/feature-Branch-Commit `latest`
      # faelschlich zurueckdrehen koennte). Pruefung via
      # `git merge-base --is-ancestor`: ist der getaggte SHA
      # ein Vorfahre des Default-Branch-Tip, dann ist der Tag
      # auf der Release-Linie.
      - name: Check tag commit is on default branch
        id: tag-on-default
        if: github.event_name == 'push'
        run: |
          git fetch origin "${DEFAULT_BRANCH}":refs/remotes/origin/default-branch
          if git merge-base --is-ancestor "${TAG_SHA}" refs/remotes/origin/default-branch; then
            echo "on-default=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-default=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_SHA: ${{ github.sha }}

      # `:latest`-Push nur bei Tag-Push UND Tag auf Default-
      # Branch. Pattern: `docker buildx imagetools create`
      # setzt das Tag-Alias am Registry-Manifest direkt
      # (kein Re-Push noetig).
      - name: Tag and push :latest (tag on default branch only)
        if: steps.tag-on-default.outputs.on-default == 'true'
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:${{ steps.resolve-version.outputs.version }}"

      # ADR 0042 §2.1: SBOM MUSS gegen das gepushte Runtime-
      # Image-Digest laufen — Syft direkt gegen den GHCR-
      # Reference. KEIN `make sbom`-Aufruf, weil `sbom: build`
      # (Makefile Z.462) das Image lokal neu bauen und das
      # gepullte Digest-Alias damit ueberschreiben wuerde.
      # Direkt-Syft umgeht die Make-Build-Dependency und
      # garantiert den 1:1-Bezug zu dem in GHCR publizierten
      # Manifest-Digest.
      - name: Generate SBOM against pushed image digest (direct syft)
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/artifacts":/artifacts \
            anchore/syft:v1.17.0 \
            "ghcr.io/${{ github.repository }}@${{ steps.build-push.outputs.digest }}" \
            -o "cyclonedx-json=/artifacts/sbom-${{ steps.resolve-version.outputs.version }}.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: artifacts/sbom-*.cdx.json
          if-no-files-found: error
          retention-days: 1

  produce-assets:
    name: Produce release assets (test/coverage/openapi/demo)
    runs-on: ubuntu-latest
    needs: build-and-publish-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # SBOM wurde im build-and-publish-image-Job gegen den
      # gepushten Digest erzeugt (ADR 0042 §2.1). Download
      # statt zweitem lokalen Build.
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: release-sbom
          path: artifacts/

      # Lokaler Build der test-/coverage-/openapi-Stages —
      # diese Stages produzieren die anderen 4 Asset-Files.
      # Cache wird vom build-and-publish-image-Job geteilt.
      - name: Build test-unit stage & extract JUnit-XML
        run: |
          make test-unit
          docker create --name test-unit-extract grid-gym-test-unit:latest
          mkdir -p artifacts
          docker cp test-unit-extract:/src/coverage/test-results.xml \
            artifacts/test-results-${{ needs.build-and-publish-image.outputs.version }}.xml
          docker rm test-unit-extract

      - name: Build coverage-gate stage & extract HTML tarball
        run: |
          make coverage-gate
          docker create --name coverage-extract grid-gym-coverage-gate:latest
          docker cp coverage-extract:/src/coverage/htmlcov artifacts/htmlcov
          docker rm coverage-extract
          tar -czf artifacts/coverage-html-${{ needs.build-and-publish-image.outputs.version }}.tar.gz \
            -C artifacts htmlcov
          rm -rf artifacts/htmlcov

      - name: Build openapi-validate stage & extract OpenAPI-JSON
        run: |
          make openapi-validate
          docker create --name openapi-extract grid-gym-openapi-validate:latest
          docker cp openapi-extract:/src/artifacts/openapi.json \
            artifacts/openapi-${{ needs.build-and-publish-image.outputs.version }}.json
          docker rm openapi-extract

      - name: Copy demo abnahme doc as release asset
        run: |
          cp docs/user/gg-demo-008-abnahme.md \
            artifacts/gg-demo-008-abnahme-${{ needs.build-and-publish-image.outputs.version }}.md

      - name: Upload assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/
          retention-days: 1
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-publish-image, produce-assets]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-publish-image.outputs.version }}
          name: ${{ needs.build-and-publish-image.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
