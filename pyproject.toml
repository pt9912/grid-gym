# pyproject.toml — grid-gym
#
# Verbindlicher Stack gemaess ADR 0002 (Accepted 2026-05-15) und
# ADR 0005 (Accepted 2026-05-15). Konfiguration der vier A-1-Gates
# (lint-imports, ruff, arch_check.py, mypy --strict) plus
# Repository-Layout (`src/grid_gym/hexagon/{core,ports}/`,
# `src/grid_gym/adapters/`). Aenderungen an diesem File brauchen
# fortan eine Folge-ADR, sobald sie ADR-0002-§A-1- oder
# ADR-0005-§5.1-Vertraege beruehren.

[project]
name = "grid-gym"
version = "0.1.0"
description = "Modulare Open-Source-Plattform zur Simulation, Validierung und Analyse elektrischer Energiesysteme"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "grid-gym contributors" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]

# Runtime-Dependencies (M1 Welle 6a):
# - `fastapi` + `uvicorn`: Driving-Adapter `adapters/driving/http_api/`
#   (`GG-API-001..003`, `openapi-validate`-Stage in Dockerfile).
# - `pydantic`: Request-/Response-Schemas am API-Rand.
# - `psycopg`, `alembic`: M1-Welle-6c-Postgres-Persistenz.
# - `opentelemetry-sdk` + `opentelemetry-exporter-otlp-proto-grpc`:
#   M3-Welle-6 OTLP-Adapter (`adapters/driven/telemetry_otlp/`),
#   gRPC-Transport gepinnt per `OTEL_EXPORTER_OTLP_PROTOCOL=grpc`
#   (ADR 0024 §2 + M3-Welle-6-Slice §3 D-2/D-3). `grpcio` kommt
#   transitiv ueber den Exporter.
# Die Imports sind nur in `src/grid_gym/adapters/driving/**` und
# `src/grid_gym/adapters/driven/**` erlaubt — die import-linter-
# Contracts `AC-NO-FW`/`AC-PORTS-NO-FW` halten `hexagon/core/**`
# und `hexagon/ports/**` frei davon.
dependencies = [
    # Floor `>=0.136` matched aktuellen PyPI-Stand 0.136.3 (2026-05-24,
    # User-verifiziert) — angehoben von >=0.115 (M1-Welle-6a-Floor).
    "fastapi>=0.136",
    # Floor `>=0.47` matched aktuellen PyPI-Stand 0.47.0 (2026-05-24,
    # User-verifiziert) — angehoben von >=0.30 (M1-Welle-6a-Floor).
    "uvicorn[standard]>=0.47",
    # Floor `>=2.13` matched aktuellen PyPI-Stand 2.13.4 (2026-05-24,
    # User-verifiziert) — angehoben von >=2.7 (M1-Welle-6a-Floor).
    "pydantic>=2.13",
    # Welle 6c — Postgres-Persistenz fuer `RunRepositoryPort`.
    # Floor `>=3.3` matched aktuellen PyPI-Stand 3.3.4 (2026-05-24,
    # User-verifiziert) — angehoben von >=3.2 (M2-Welle-6c-Floor).
    "psycopg[binary]>=3.3",
    # Floor `>=1.18` matched aktuellen PyPI-Stand 1.18.4 (2026-05-24,
    # User-verifiziert) — angehoben von >=1.13 (M1-Welle-6c-Floor).
    "alembic>=1.18",
    # M3-Welle-6 — OTLP-Adapter unter `adapters/driven/telemetry_otlp/`.
    # Floor `>=1.42,<1.43` matched die Welle-6-Lock-Resolution (`uv lock`
    # 2026-05-24 zieht 1.42.1) — Welle 6 testet ausschliesslich gegen
    # diese Linie; ein cache-loses Install ohne Lock soll nicht in
    # alte 1.27..1.41er-Versionen abrutschen, **und** ein 1.43er-Upgrade
    # darf nicht silent passieren, weil OTLP-Log-Exporter-Pfade in
    # `_log_exporter` (Underscore-Prefix) historisch unstable sind
    # (M3-welle-6.md §7 R-X, Review-Folge M-2).
    "opentelemetry-sdk>=1.42,<1.43",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42,<1.43",
    # M4-Welle-2 — MQTT-Adapter unter `adapters/driven/protocol_mqtt/`.
    # Floor `>=2.0` matched paho-mqtt 2.x mit CallbackAPIVersion.VERSION2;
    # 1.x-Linie haette eine andere Callback-Signatur und ist EOL.
    # Adapter-Sichtbarkeit ist per AC-PORTS-NO-FW / AC-NO-FW Forbidden-
    # List bereits seit Spike-0 vorbelegt (siehe `paho`-Eintraege dort).
    "paho-mqtt>=2.0",
    # M4-Welle-3 — Modbus-TCP-Adapter unter
    # `adapters/driven/protocol_modbus/`. Floor `>=3.6,<4.0` pinnt die
    # 3.x-Sync-API-Linie (`ModbusTcpClient` + `slave=`-Kwarg seit 3.x);
    # 4.x deprecated potenziell die Sync-API zugunsten der Async-Linie
    # — Welle 3 setzt explizit auf Sync (ADR 0032 §2.3 Decision M-c).
    # `pymodbus`-Sichtbarkeit ist per AC-PORTS-NO-FW / AC-NO-FW
    # Forbidden-List bereits Welle-0-vorbelegt.
    "pymodbus>=3.6,<4.0",
    # M4-Welle-4 — OPC-UA-Adapter unter
    # `adapters/driven/protocol_opcua/`. Pin `>=1.2b2,<2.0` weil
    # asyncua 1.1.8 (letzte stabile 1.x) unter Python 3.14 in der
    # internen `create_type_serializer`-Pipeline an Forward-References
    # von `from __future__ import annotations` scheitert (`issubclass()
    # arg 1 must be a class`). asyncua 1.2b2 (Beta) tragt den
    # Python-3.14-Fix vor der 1.2-final-Release; das `>=1.2b2`-Range-
    # Pin (Slice-032-Schaerfung Finding 5.1) erlaubt Auto-Upgrade auf
    # 1.2b3/1.2-final ohne `pyproject.toml`-Edit. `<2.0` schuetzt vor
    # Major-API-Drift. Sobald 1.2-final auf PyPI ist, wandert der Pin
    # auf `>=1.2,<2.0` (Folge-Pflicht; ADR 0033 §5). `Client.connect()`/
    # `Node.read_value()`/`Node.write_value(Variant)`-API sind in 1.2
    # rueckwaerts-kompatibel zu 1.1.x. asyncua ist LGPL-3.0 —
    # Library-Linking unter MIT-Repo ok; `asyncua`-Sichtbarkeit ist
    # per AC-PORTS-NO-FW / AC-NO-FW Forbidden-List bereits Welle-0-
    # vorbelegt.
    "asyncua>=1.2b2,<2.0",
    # M4-Welle-5a — DNP3-Adapter unter
    # `adapters/driven/protocol_opcua/`. Master/Client via
    # `nfm-dnp3` 1.0.x (PyPI, MIT, Pure-Python, Beta `Development
    # Status :: 4`). `DNP3Master`-Klasse ist sync-by-design (C1-
    # Probe-Run verifiziert: alle public Methoden ohne async-Marker;
    # Thread-Lock-Schutz fuer Concurrent-Use per Library-Doku) und
    # passt damit direkt in die Sync-`DeviceProtocolPort`-Surface
    # ohne Adapter-internen Thread-Marshal (ADR 0034 §2.2 Decision
    # D-b). Pin `>=1.0,<2.0` schuetzt vor 2.x-Major-API-Drift.
    # Import-Name: `dnp3py` (Library-eigene Naming-Konvention).
    # MIT-Lizenz, Pure-Python — keine native-Compile-Notwendigkeit,
    # aarch64-Linux-Support automatisch.
    "nfm-dnp3>=1.0,<2.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_gym"]

# ---------------------------------------------------------------------------
# Dependency Groups (PEP 735)
# Trennung von Toolchain-Kategorien; `uv sync --all-groups` im Dockerfile
# `deps`-Stage installiert alle Gruppen fuer CI-Gates.
# ---------------------------------------------------------------------------

[dependency-groups]
lint = [
    # Floor `>=0.15` weil mehrere fuer GG-CC-001/GG-PRINC-005 relevante
    # Regeln (`PLR0904`, `PLR0916`) in ruff 0.15 unter dem Preview-Flag
    # stehen; aeltere Versionen kennen sie nicht zuverlaessig.
    "ruff>=0.15",
]
arch = [
    "import-linter>=2.0",
    "grimp>=3.4",
]
typecheck = [
    # `>=2.0,<3.0`: ADR 0005 nennt zwar `>=1.13` als historischen Floor,
    # aber mypy 2.x ist seit 2026 die aktuelle Major-Version und der Lock
    # resolved auf 2.1.0. Wir pinnen die Major auf 2 — ein 3.x-Upgrade
    # braucht eine eigene ADR-Aenderung (`mutable-override` /
    # `truthy-iterable` koennten dort umbenannt sein).
    "mypy>=2.0,<3.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    # `fastapi.testclient` braucht `httpx` (M1 Welle 6a).
    "httpx>=0.27",
    # Welle 6c — Integration-Tests gegen ephemeren Postgres.
    "testcontainers[postgres]>=4.0",
    # M4-Welle-5a — DNP3-Outstation als Test-Sibling im
    # in-process-Smoke (ADR 0034 §2.5 Decision D-e).
    # `dnp3-outstation` ist MIT, Pure-Python, asyncio-native,
    # IEEE-1815-2012-Level-1-Subset. **Nur Test-Dependency** —
    # Production-Adapter laeuft mit `nfm-dnp3` (Master) allein.
    # Pin `>=0.2,<1.0` — Pre-1.0-Library, Wire-Compat gegen
    # `nfm-dnp3` per C1-Probe verifiziert (siehe ADR 0034 §1).
    "dnp3-outstation>=0.2,<1.0",
]
audit = [
    "pip-audit>=2.7",
    "openapi-spec-validator>=0.7",
]
dev = [
    { include-group = "lint" },
    { include-group = "arch" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "audit" },
]

# ---------------------------------------------------------------------------
# ruff (ADR 0002 §A-1)
# Regelgruppen decken AC-TYPED-ERRORS, AC-NO-TIME (DTZ-Teil),
# AC-NO-RAND (Modul-Import-Teil), Security-Subset, SOLID-Heuristiken
# auf Klassen-Ebene und Methodenlaengen-Gate aus `GG-CC-001`.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Preview-Mode aktiv, weil mehrere fuer GG-CC-001 / GG-PRINC-005
# relevante Regeln (`PLR0904` too-many-public-methods,
# `PLR0916` too-many-boolean-expressions) in ruff 0.15 noch hinter
# dem Preview-Flag stehen.
#
# CAVEAT: `select` nutzt unten zum Teil Gruppen-Praefixe (`B`, `S`,
# `N`, `TRY`, `RUF`, etc.). Mit `preview = true` aktivieren diese
# Praefixe IMPLIZIT auch zukuenftige Preview-Regeln derselben Gruppe
# bei ruff-Upgrades. Drift-Liste in
# `docs/plan/planning/next/spike-0-results.md` §5 verfolgt das.
# Bei ungewollten neuen Findings nach `make lock-refresh`: entweder
# `select` auf explizite Rule-IDs umstellen oder die neue Regel via
# Per-File-Ignore deaktivieren — beides mit ADR-Verweis.
preview = true
select = [
    # AC-TYPED-ERRORS / GG-CC-008
    "BLE",
    "TRY",
    "B904",
    "B",
    # AC-NO-TIME / GG-AR-TABU-005 (Teilabdeckung)
    "DTZ",
    # Security-Subset
    "S",
    # AC-NO-RAND / GG-AR-TABU-005 (Modul-Imports)
    "TID",
    # GG-CC-001 — Methodenlaengen-Gate
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0916",
    "PLR2004",
    # GG-PRINC-002/005, GG-CC-006 — SRP/ISP-Heuristiken
    # Hinweis: ruff 0.15 implementiert weder PLR0902 (too-many-instance-
    # attributes) noch PLR0903 (too-few-public-methods). Diese beiden
    # Heuristiken bleiben Code-Review-pflichtig (siehe Folge-Trigger
    # `docs/plan/planning/open/001-code-review-doc.md`). PLR0904
    # (too-many-public-methods, breite API) ist die einzige aktiv
    # genutzte SRP/ISP-Heuristik auf Klassen-Ebene.
    "PLR0904",
    # GG-CC-005 — sprechende Namen (heuristisch)
    "N",
    # Code-Hygiene
    "RET",
    "SIM",
    "ARG",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30
max-branches = 12
max-args = 5
max-returns = 6
max-bool-expr = 4
max-public-methods = 12
# `max-attributes` waere fuer PLR0902 (too-many-instance-attributes)
# relevant — in ruff 0.15 nicht implementiert; siehe Hinweis bei
# der `PLR0904`-Auswahl oben.

[tool.ruff.lint.flake8-tidy-imports]
# AC-NO-RAND: Modulimport-Verbot global (Aufruf-Site-Check ergaenzend in
# tools/arch_check.py). Per-File-Ignores unten erlauben Adapter und Tests.
banned-module-level-imports = ["random", "secrets", "numpy.random"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# AC-NO-TIME: datetime.datetime.utcnow ist von DTZ nicht erfasst.
"datetime.datetime.utcnow" = { msg = "Use ClockPort.now(tz=UTC) — GG-AR-TABU-005" }

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S104", "S105", "S106", "S311",
    "BLE001", "TRY003",
    "DTZ", "TID",
    "C901",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0916", "PLR2004",
    "PLR0904",
    "N802", "N803", "N806",
    "ARG001", "ARG002",
    "RUF012",
]
"src/grid_gym/adapters/driving/http_api/error_translation.py" = ["BLE001"]
"src/grid_gym/adapters/driven/protocol_*/error_translation.py" = ["BLE001"]
"src/grid_gym/adapters/driven/persistence_*/error_translation.py" = ["BLE001"]
"src/grid_gym/adapters/**" = ["DTZ", "TID"]
# DeviceModel-Implementationen tragen die Protocol-Surface (7 Member)
# plus Welle-2-Review-Hooks (drain_alarms/set_run_id/alarms-Property)
# — das uebersteigt regelmaessig die `max-public-methods=12`-Schwelle.
# Per-File-Ignore statt cargo-cult-noqa pro Klasse (Welle-3-Review L-5).
"src/grid_gym/hexagon/core/devices/*/model.py" = ["PLR0904"]
# Mersenne-Twister-Adapter benutzt `random.Random` bewusst fuer
# Determinismus (`ADR 0007 §5.1`), nicht fuer Krypto. S311 ist
# explizit fuer Crypto-Kontext gedacht; der deterministische
# Sim-PRNG ist die richtige Wahl hier. Per-File-Ignore statt
# `# noqa: S311` (Slice 027 Paket E).
"src/grid_gym/adapters/driven/random_mt/mersenne_twister.py" = ["S311"]
# GridModelBilanz traegt analog zur Geraete-API eine breite Property-/
# Methoden-Surface (Welle-5b-Erweiterung um active_load_events +
# active_load_profiles bringt die Zahl ueber den Default-Schwellenwert).
"src/grid_gym/hexagon/core/grid_model/bilanz.py" = ["PLR0904"]
# TickLoop ist der zentrale Simulations-Orchestrator und nimmt
# Welle-6a alle Dependencies (run_id, tick_ms, clock, random,
# scheduler, devices, grid_model) als Konstruktor-kwargs entgegen
# — PLR0913 (max 5 Args) ist hier nicht haltbar, weil die
# Abhaengigkeits-Liste mit M2-Welle-1..5 strukturell gewachsen ist.
"src/grid_gym/hexagon/core/simulation/tick_loop.py" = ["PLR0913"]
# M3-Welle-6-C2: Bounded-Poll auf controlled-internal URL
# (`http://otel-collector:13133/` per Compose-Sibling-Hostname).
# `S310` warnt vor user-supplied URLs; hier ist die URL
# constant + intern. Per-File-Ignore statt `# noqa: S310`
# (Slice 027 Konvention).
"tools/wait_otel_collector.py" = ["S310"]
# M3-Welle-6-C3 / Trigger 029: Matrix-Diagnose-Script darf
# je Variant-Iteration alle Exceptions fangen (Liste der
# OTel-SDK-Failure-Modes ist Teil dessen, was wir hier
# eingrenzen — engerer except waere willkuerlich).
"tools/diagnose_otlp_span_export.py" = ["BLE001", "S310"]

# ---------------------------------------------------------------------------
# mypy --strict (ADR 0005)
# Scope kommt ausschliesslich aus der `files`-Direktive — Kommandozeilen-
# Pfade in CI sind bewusst nicht gesetzt (Single-Source-of-Truth).
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
files = ["src/grid_gym", "tools"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
enable_error_code = [
    "redundant-self",
    "possibly-undefined",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false

# asyncua 1.2b2 liefert py.typed-Marker, exportiert aber kein `__all__`
# im Top-Level. `no_implicit_reexport=true` (strict-Default) wuerde
# damit `from asyncua import Client` als nicht-exportiert melden.
# `implicit_reexport = true` toleriert die Re-Exports analog zu
# asyncua's eigener `__init__.py`-Konvention; alle aufgerufenen
# asyncua-APIs sind in ADR 0033 §2.2/§2.3 als Vertragsschnitt
# explizit dokumentiert.
[[tool.mypy.overrides]]
module = "asyncua.*"
implicit_reexport = true

# nfm-dnp3 1.0.1 (Pure-Python Beta) liefert keinen py.typed-Marker;
# `ignore_missing_imports` deaktiviert die `import-untyped`-Warnung,
# damit der M4-Welle-5a-Adapter (`adapters/driven/protocol_dnp3/`)
# `mypy --strict` ohne Inflation passieren kann. Aufgerufene
# `DNP3Master`-APIs sind in ADR 0034 §2.2/§2.4 als Vertragsschnitt
# explizit dokumentiert.
[[tool.mypy.overrides]]
module = "dnp3py.*"
ignore_missing_imports = true

# dnp3-outstation 0.2.0 ist Test-only-Dependency (Pre-1.0); kein
# py.typed-Marker. Nur in `tests/integration/test_dnp3_in_process_smoke.py`
# importiert.
[[tool.mypy.overrides]]
module = "dnp3_outstation.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# import-linter (ADR 0002 §A-1, AC-CORE-NO-ADAPTERS bis AC-NO-IO-MOD)
# Layer- und Forbidden-Contracts; ergaenzt durch tools/arch_check.py
# fuer Aufruf-Site- und Immutability-Heuristiken.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "grid_gym"
# Pflicht, sobald `forbidden_modules` externe Pakete (z. B. `fastapi`,
# `socket`) enthaelt — sonst beschwert sich import-linter bei
# `lint-imports`.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AC-CORE-NO-ADAPTERS"
type = "forbidden"
source_modules = ["grid_gym.hexagon.core"]
forbidden_modules = ["grid_gym.adapters"]

[[tool.importlinter.contracts]]
name = "AC-CORE-NO-DRIVING"
type = "forbidden"
source_modules = ["grid_gym.hexagon.core"]
forbidden_modules = ["grid_gym.hexagon.ports.driving"]

[[tool.importlinter.contracts]]
name = "AC-PORTS-NO-OUT"
type = "forbidden"
source_modules = ["grid_gym.hexagon.ports"]
forbidden_modules = [
    "grid_gym.adapters",
    "grid_gym.hexagon.core.simulation",
    "grid_gym.hexagon.core.devices",
    "grid_gym.hexagon.core.scenario",
    "grid_gym.hexagon.core.replay",
    "grid_gym.hexagon.core.faults",
    "grid_gym.hexagon.core.agents",
]

[[tool.importlinter.contracts]]
name = "AC-PORTS-NO-FW"
type = "forbidden"
source_modules = ["grid_gym.hexagon.ports"]
# Hinweis: import-linter laesst keine Subpakete externer Pakete als
# `forbidden_modules` zu (`urllib.request`, `http.client`,
# `logging.handlers`). Die werden in Welle 3 via tools/arch_check.py
# AST-basiert geprueft. Hier nur Top-Level-Module.
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "psycopg",
    "sqlalchemy",
    "alembic",
    "httpx",
    "paho",
    "pymodbus",
    "asyncua",
    # M3-Welle-6 — OTel-SDK + gRPC duerfen nur im OTLP-Adapter
    # (`adapters/driven/telemetry_otlp/`) erscheinen, nicht in Ports.
    # ADR 0024 §2.1 (keine OTLP-/SDK-Typen im Port-Layer).
    "opentelemetry",
    "grpc",
    "socket",
    "pathlib",
]

[[tool.importlinter.contracts]]
name = "AC-ADAPTER-PURE"
type = "forbidden"
source_modules = ["grid_gym.adapters"]
forbidden_modules = [
    "grid_gym.hexagon.core.simulation",
    "grid_gym.hexagon.core.devices",
    "grid_gym.hexagon.core.scenario",
    "grid_gym.hexagon.core.replay",
    "grid_gym.hexagon.core.faults",
    "grid_gym.hexagon.core.agents",
]

[[tool.importlinter.contracts]]
name = "AC-NO-FW"
type = "forbidden"
source_modules = ["grid_gym.hexagon.core"]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "psycopg",
    "sqlalchemy",
    "alembic",
    "httpx",
    "paho",
    "pymodbus",
    "asyncua",
    # M3-Welle-6 — OTel-SDK + gRPC duerfen nur im OTLP-Adapter
    # (`adapters/driven/telemetry_otlp/`) erscheinen, nicht im Core.
    # ADR 0024 §2.1 + M3-Welle-6-D-4 (kein `time.*` im Adapter-Code
    # — Wall-Clock-Quelle ist die externe SDK; Core ist davon doppelt
    # geschuetzt durch AC-NO-FW + AC-NO-TIME).
    "opentelemetry",
    "grpc",
]

[[tool.importlinter.contracts]]
name = "AC-NO-IO-MOD"
type = "forbidden"
source_modules = ["grid_gym.hexagon.core"]
# Top-Level-stdlib-IO-Module. Nested-Module wie `urllib.request`,
# `http.client`, `logging.handlers` faengt die AST-Pruefung in
# tools/arch_check.py ab (Welle 3).
forbidden_modules = ["socket", "pathlib"]

# ---------------------------------------------------------------------------
# grid_gym.arch_check (ADR 0002 §A-1 / A-2)
# Single-Source-of-Truth fuer Whitelists des tools/arch_check.py.
# Erweiterung erfordert ADR-Verweis.
# ---------------------------------------------------------------------------

[tool.grid_gym.arch_check]
# AC-NO-JSON: einzige Pfade, in denen json.dumps/json.dump-Aufrufe
# erlaubt sind. tools/arch_check.py liest diese Liste und meldet
# jede Aufruf-Site ausserhalb als Verstoss. Erweiterung erfordert
# ADR-Verweis.
json-dumps-whitelist = [
    "src/grid_gym/hexagon/core/serialization/canonical.py",
]
# AC-DOMAIN-FROZEN: zusaetzliche Module ausserhalb hexagon.core.domain,
# die wie domain.* immutable sein muessen (z. B. Snapshot-Daten-
# klassen, die ausserhalb der Domain leben).
#
# Akzeptierte Klassen-Formen: `@dataclass(frozen=True, slots=True)`
# oder Vererbung von einer Klasse mit literalem Namen `FrozenModel`
# (als ast.Name ODER ast.Attribute). Andere Frozen-Konventionen
# (`@attrs.frozen`, `pydantic.BaseModel` ohne `FrozenModel`-Alias)
# muessen entweder als `FrozenModel`-Subklasse re-aliased oder
# tools/arch_check.py erweitert werden.
domain-frozen-extra = []
# AC-TYPED-ERRORS: Module, in denen `except Exception:` zugelassen
# ist (deckungsgleich mit den ruff-Per-File-Ignores oben, aber als
# Single-Source-of-Truth fuer arch_check.py konsumierbar).
typed-errors-exempt = [
    "src/grid_gym/adapters/driving/http_api/error_translation.py",
    "src/grid_gym/adapters/driven/protocol_*/error_translation.py",
    "src/grid_gym/adapters/driven/persistence_*/error_translation.py",
]
# AC-HEXAGON-PURE: Whitelist fuer Dritt-Pakete, die in
# src/grid_gym/hexagon/** importiert werden duerfen (zusaetzlich zu
# stdlib und grid_gym.*). Erweiterung erfordert ADR-Verweis.
# Beispiel: "pydantic" fuer `FrozenModel`-Basisklasse in
# hexagon.core.domain (siehe AC-DOMAIN-FROZEN).
hexagon-import-whitelist = []
# AC-TICK-LOOP-PRIVATE-RESUME-ERRORS (Slice 028): Whitelist fuer
# (Datei, Symbol)-Paare, die einen modul-lokalen Underscore-Import
# aus `src/grid_gym/hexagon/core/simulation/tick_loop.py` vornehmen
# duerfen. Format: `"<rel-pfad>:<symbol>"`. Erweiterung erfordert
# ADR-Verweis (Slice 028 §3).
#
# Aktuell ein Eintrag: `test_loader_factory_sync.py` prueft absichtlich
# Drift zwischen `loader._DEVICE_FACTORIES` und
# `tick_loop._DEVICE_TYPE_BY_CLASS_NAME` (Welle-6b-Review L-1) — ein
# legitimer Whitebox-Architekturtest, kein normaler Konsument der
# privaten Konstante.
tick-loop-private-import-exempt = [
    "tests/unit/hexagon/core/scenario/test_loader_factory_sync.py:_DEVICE_TYPE_BY_CLASS_NAME",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "determinism: Property-Tests fuer Determinismus (GG-SIM-001..004)",
    "replay: Replay-Diff- und Golden-File-Tests (GG-REPLAY-007)",
    "fault: Fault-Injection-Tests (GG-FAULT-001..010)",
]

# ---------------------------------------------------------------------------
# coverage.py
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/grid_gym"]

[tool.coverage.report]
# Coverage-Pragmas (`# pragma: no cover`, `# pragma: no branch`,
# `# pragma: exclude file`) sind projekt-weit verboten
# (AC-NO-COVERAGE-PRAGMA, tools/arch_check.py). Stattdessen:
# - Protocol-Stubs mit `...`-Body werden ueber den
#   `^\\s*\\.\\.\\.\\s*$`-Pattern ausgeschlossen (sie sind nie zur
#   Laufzeit aufgerufen, ihr `...` ist nur Typing-Marker).
# - `raise NotImplementedError` markiert echte Sub-Class-Pflicht-Methoden.
# - `if TYPE_CHECKING:`-Bloecke sind reine Typing-Imports.
exclude_lines = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]
