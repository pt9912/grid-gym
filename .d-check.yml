# Doku-Referenz-Checks via d-check (ghcr.io/pt9912/d-check) — ersetzt
# tools/check_refs.py (Trigger 002; Rollout 2026-06-12,
# Python-Familie). Scan über die Repo-Wurzel: deckt den Alt-Scope
# (AGENTS.md, docs/, spec/, harness/) ab und nimmt die übrige
# Root-Doku (README*, CHANGELOG, CONTRIBUTING) als Mehr-Abdeckung
# mit; src/ (vendored UI-Doku) und .github/ (PR-Template mit
# Platzhaltern) bleiben außen vor. `anchors` ist Mehr-Abdeckung.
# `ids` (Trigger 043, d-check v0.3.0 <modul>.scope): Linkpflicht für
# Kennungen auf allen LEBENDEN Doku-Flächen. Bewusst außen vor
# (Historie; Retro-Verlinkung wäre Audit-Trail-Umschreiben,
# Trigger-043-Nicht-Ziel): docs/plan/** (Planning-Docs +
# Accepted-ADRs, textlich unveränderlich) und CHANGELOG.md
# (released Einträge sind eingefroren).
# Muster-Reihenfolge = Präzedenz (GG-AR- vor GG-).
# Beschreibung siehe: https://raw.githubusercontent.com/pt9912/d-check/refs/heads/main/README.md
scan:
  roots: ["."]
  ignore: ["src/**", ".github/**"]
modules: [links, anchors, ids]
ids:
  scope:
    roots: ["."]
    ignore: ["docs/plan/**", "CHANGELOG.md", "src/**", ".github/**"]
  patterns:
    - regex: 'GG-AR-[A-Z0-9-]+-\d{3}'
      target: spec/architecture.md
    - regex: 'GG-[A-Z]+-\d{3}'
      target: spec/lastenheft.md
    - regex: 'AC-[A-Z][A-Z0-9-]+'
      target: spec/architecture.md
    - regex: 'ADR[- ]\d{4}'
      target: docs/plan/adr/
