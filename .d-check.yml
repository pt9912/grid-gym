# Doku-Referenz-Checks via d-check (ghcr.io/pt9912/d-check)
# Beschreibung siehe: https://raw.githubusercontent.com/pt9912/d-check/refs/heads/main/README.md
# Eingebunden ueber d-check.mk (`--print-mk`); Image-Digest in Makefile-Variable
# DCHECK_DIGEST (aktuell v0.42.0).
scan:
  roots: ["."]
  ignore: ["src/**", ".github/**"]
# Empfohlenes ai-harness-Standard-Set. spans (Span-Artefakte) + hostpaths
# (host-lokale Pfad-Leaks): hermetisch, ohne eigene Optionen.
modules: [links, anchors, ids, codepaths, matrix, spans, hostpaths]
ids:
  scope:
    roots: ["."]
    ignore:
      [
        "docs/plan/planning/done-archive/**",
        "CHANGELOG.md",
        "src/**",
        ".github/**",
        "docs/plan/traceability.md",
      ]
  patterns:
    - regex: 'GG-AR-[A-Z0-9-]+-\d{3}'
      target: spec/architecture.md
      link-policy: always
    # Benannte Architektur-IDs ohne Ziffern (Komponenten/Tabus):
    - regex: 'GG-AR-COMP-[A-Z0-9]+'
      target: spec/architecture.md
      link-policy: always
    - regex: 'GG-[A-Z][A-Z0-9]*-\d{3}'
      target: spec/lastenheft.md
      link-policy: always
    - regex: "AC-[A-Z][A-Z0-9-]+"
      target: docs/plan/adr/
      link-policy: always
    - regex: 'ADR[- ]\d{4}'
      target: docs/plan/adr/
      link-policy: always
    # Familien-Wildcards (Kurzschrift, z. B. GG-DEMO-*): erzwingen
    # Link ODER Backtick-Form (Inline-Code ist linkpflichtfrei) —
    # nackte Familien-Refs fallen sonst durchs \d{3}-Raster.
    - regex: 'GG-AR-[A-Z0-9-]*\*'
      target: spec/architecture.md
    - regex: 'GG-[A-Z][A-Z0-9-]*\*'
      target: spec/lastenheft.md
    - regex: 'AC-[A-Z][A-Z0-9-]*\*'
      target: docs/plan/adr/

# Pfade in Inline-Code (DC-FA-CODE-001, aktiviert 2026-06-12 nach
# User-Befund "done/M5-results.md in carveouts-Prosa"): explizite
# Pfade in Backticks muessen existieren. Gleiche Historie-Grenze
# wie ids. Geplante/historische Pfade tragen den zeilen-scoped
# d-check:ignore-Marker mit Begruendung. Zeilen-/Symbol-Refs
# stehen ausserhalb des Code-Spans: `pfad.py` (Z. 12-15).
codepaths:
  scope:
    roots: ["."]
    ignore: ["docs/plan/planning/done-archive/**", "CHANGELOG.md", "src/**", ".github/**", "docs/plan/traceability.md"]
  roots: [docs, spec, src, tests, tools, deploy, harness]

# Referenzrichtungs-Gate (SDP, Trigger 048, DC-FA-MTX-001). Stabilitaets-
# Rang: Vertrag > Technik > Sicht > ADR > Slice; normative Kanten zeigen
# strikt aufwaerts (Abwaerts-Verweis = Befund `matrix-forbidden`).
# Verweise auf inaktive ADRs = `matrix-inactive`.
matrix:
  classes:
    - {name: contract, paths: [spec/lastenheft.md]}
    - {name: technik, paths: [spec/protocol_profiles.md]}
    - {name: sicht, paths: [spec/architecture.md]}
    - {name: adr, paths: ["docs/plan/adr/[0-9]*.md"]}
    - {name: slice, paths: ["docs/plan/planning/**/*.md"]}
  rules:
    # SDP: die Spec-Straten (Vertrag/Technik/Sicht) duerfen nicht abwaerts
    # auf ADRs/Slices verweisen. ADR->Slice (Bezug-Provenance) bleibt
    # erlaubt — die ADR-Lineage-/Slice-Kante ist nicht Gegenstand von 048.
    - {from: contract, to: technik, allow: false}
    - {from: contract, to: sicht, allow: false}
    - {from: contract, to: adr, allow: false}
    - {from: contract, to: slice, allow: false}
    - {from: technik, to: sicht, allow: false}
    - {from: technik, to: adr, allow: false}
    - {from: technik, to: slice, allow: false}
    - {from: sicht, to: adr, allow: false}
    - {from: sicht, to: slice, allow: false}
  status:
    forbidden: [superseded, deprecated]
    # d-check v0.11.0 (Trigger 050): Supersede-Lineage-Carve-out — die
    # abloesende ADR darf ihre abgeloeste ADR verlinken, wenn ein
    # Supersede-Feld (`Supersedes`/`Aenderungstyp`) das Ziel nennt. Alle
    # anderen Verweise auf inaktive Dokumente bleiben `matrix-inactive`.
    allow-supersede-lineage: true
    supersede-fields: [Supersedes, Aenderungstyp]
  # SDP Regel 5 (Body vs. Changelog): ADR-/Slice-Provenance lebt nur unter
  # einer Historie-Sektion — diese Ueberschriften sind vom Richtungs-Gate
  # ausgenommen.
  exclude-sections:
    # §27-Traceability ist nach docs/plan/traceability.md ausgelagert (Slice 063);
    # verbleibend nur die architektur-internen Traceability-/Offen-Punkte-Sektionen.
    - "19. Offene architektonische Punkte"

# RTM (--trace / make doc-trace, seit d-check v0.40.0 konfigurierbar). KEIN Modul,
# rein advisory (`make doc-complete`/--require-complete bewusst NICHT verdrahtet).
# id-pattern = Allow-List der funktionalen Leaf-Familien; AUSGENOMMEN (jeweils via
# traceability.md abgedeckt, kein Feature): §27.1.1-Scope/definitorisch (TERM/SEED/MVP/
# NONGOAL/FUTURE), Arch-/Design-Meta (ARCH/ARCHTEST/PRINC/CC), Test-/Gate-Infra (TEST/
# TESTTYPE/QG/COV/QA). GG-CICD/GG-TRACE bleiben bewusst drin (echte Deliverables).
# Neue funktionale Familie hier ergaenzen.
trace:
  requirements:
    source: spec/lastenheft.md
    id-pattern: 'GG-(ACCEPT|AGENT|API|BESS|CICD|DATA|DEMO|DEPLOY|DEV|DNP3|FAULT|GRID|IEC|LWM2M|MODB|MQTT|OPCUA|OTEL|PERSIST|REPLAY|RT|SAFE|SCN|SIM|SNMP|TRACE|UI)-\d{3}'
    # RFC-2119-Modalitaet als RTM-Spalte (seit d-check v0.42.0). `{}` = Built-in
    # DE+EN-Defaults (MUSS->must, SOLLTE->should, KANN->may, DARF NICHT->must,
    # MUSS NICHT->may); klassifiziert per laengstem Wortgrenzen-Treffer im
    # normalisierten Body. Rein advisory (`make doc-trace`); `require-levels`
    # bleibt Default `[must]`, `make doc-complete` bewusst NICHT verdrahtet.
    modality: {}
  adrs:
    dir: docs/plan/adr
    file-pattern: '^(\d{4})-.*\.md$'
    id-prefix: 'ADR-'
  slices:
    dir: docs/plan/planning
    # NNN-titel.md (Slices) UND M<n>-... (eingefrorene M1..M8-Wellen) zaehlen als
    # Liefervehikel; Label 'Slice 061' bzw. 'Slice M6' (Welle != Slice, s. ADR 0072).
    file-pattern: '^(M\d+|\d+)-.*\.md$'
    id-prefix: 'Slice '
  # Kuratierte Coverage-Quelle (v0.41.0): §27.1/§27.3 aus traceability.md zaehlen
  # range-aware als eigene RTM-Spalte 'Trace' (explizite Datei = keine ADR-Kontamination).
  # sections-Whitelist (nur die Tabellen; Intro/Praembeln zaehlen NICHT). Waise = ohne
  # Slice/Welle UND ohne Coverage. ACHTUNG: orphans=0 = Design-Mapping, NICHT Lieferung
  # (menschen-sichtbarer Caveat im traceability.md-Intro). §27.2 in Slice 066 delegiert.
  coverage:
    - files: [docs/plan/traceability.md]
      label: Trace
      ranges: true
      sections: ["27.1 Anforderung zu Design", "27.3 Anforderung zu Test"]
      exclude-sections: ["27.1.1 Anforderungen ohne Design-Artefakt"]

# targets (Trigger 068 C1): Doku-<->Makefile-Konsistenz. KEIN Modul — via `make
# doc-targets` ans lokale docs-check-Gate gehaengt. Nur Richtung 1 (gate-phantom);
# Richtung 2 (`authority:`, 38 Utility-Targets) = Tranche C1b im Trigger 068.
targets:
  # a-check.mk (ADR 0079) ist via `include` in Makefile eingebunden; das
  # `make a-check`-Target lebt dort, muss aber fuer die gate-phantom-Pruefung
  # (dokumentiert in harness/README.md) aufloesbar sein.
  makefiles: [Makefile, a-check.mk]
  doc-tables: [AGENTS.md, harness/README.md]
