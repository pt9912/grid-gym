# Doku-Referenz-Checks via d-check (ghcr.io/pt9912/d-check)
# Beschreibung siehe: https://raw.githubusercontent.com/pt9912/d-check/refs/heads/main/README.md
# Version/Integration: v0.40.0, eingebunden ueber d-check.mk (`--print-mk`);
# Image-Pin (Digest) in der Makefile-Variable DCHECK_DIGEST.
scan:
  roots: ["."]
  ignore: ["src/**", ".github/**"]
# spans (seit v0.39.0): hermetischer Span-Artefakt-Check (ungeschlossene
# Code-Spans, verschachtelte Link-Markups) — ohne eigene Optionen.
# hostpaths (2026-07-11): host-lokale absolute Pfade (Maschinen-Layout-Leaks) —
# vervollstaendigt das empfohlene ai-harness-Standard-Set (links/anchors/ids/
# matrix/codepaths/spans/hostpaths). 5 `/Development/m-trace/`-Leaks im
# done-archive vorab sanitisiert (-> `m-trace/`).
modules: [links, anchors, ids, codepaths, matrix, spans, hostpaths]
ids:
  scope:
    roots: ["."]
    ignore:
      [
        "docs/plan/planning/done-archive/**",
        "CHANGELOG.md",
        "src/**",
        ".github/**",
        "docs/plan/traceability.md",
      ]
  patterns:
    - regex: 'GG-AR-[A-Z0-9-]+-\d{3}'
      target: spec/architecture.md
      link-policy: always
    # Benannte Architektur-IDs ohne Ziffern (Komponenten/Tabus):
    - regex: 'GG-AR-COMP-[A-Z0-9]+'
      target: spec/architecture.md
      link-policy: always
    - regex: 'GG-[A-Z][A-Z0-9]*-\d{3}'
      target: spec/lastenheft.md
      link-policy: always
    - regex: "AC-[A-Z][A-Z0-9-]+"
      target: docs/plan/adr/
      link-policy: always
    - regex: 'ADR[- ]\d{4}'
      target: docs/plan/adr/
      link-policy: always
    # Familien-Wildcards (Kurzschrift, z. B. GG-DEMO-*): erzwingen
    # Link ODER Backtick-Form (Inline-Code ist linkpflichtfrei) —
    # nackte Familien-Refs fallen sonst durchs \d{3}-Raster.
    - regex: 'GG-AR-[A-Z0-9-]*\*'
      target: spec/architecture.md
    - regex: 'GG-[A-Z][A-Z0-9-]*\*'
      target: spec/lastenheft.md
    - regex: 'AC-[A-Z][A-Z0-9-]*\*'
      target: docs/plan/adr/

# Pfade in Inline-Code (DC-FA-CODE-001, aktiviert 2026-06-12 nach
# User-Befund "done/M5-results.md in carveouts-Prosa"): explizite
# Pfade in Backticks muessen existieren. Gleiche Historie-Grenze
# wie ids. Geplante/historische Pfade tragen den zeilen-scoped
# d-check:ignore-Marker mit Begruendung. Zeilen-/Symbol-Refs
# stehen ausserhalb des Code-Spans: `pfad.py` (Z. 12-15).
codepaths:
  scope:
    roots: ["."]
    ignore: ["docs/plan/planning/done-archive/**", "CHANGELOG.md", "src/**", ".github/**", "docs/plan/traceability.md"]
  roots: [docs, spec, src, tests, tools, deploy, harness]

# Referenzrichtungs-Gate (SDP, Trigger 048, DC-FA-MTX-001). Stabilitaets-
# Rang: Vertrag > Technik > Sicht > ADR > Slice; normative Kanten zeigen
# strikt aufwaerts (Abwaerts-Verweis = Befund `matrix-forbidden`).
# Verweise auf inaktive ADRs = `matrix-inactive`.
matrix:
  classes:
    - {name: contract, paths: [spec/lastenheft.md]}
    - {name: technik, paths: [spec/protocol_profiles.md]}
    - {name: sicht, paths: [spec/architecture.md]}
    - {name: adr, paths: ["docs/plan/adr/[0-9]*.md"]}
    - {name: slice, paths: ["docs/plan/planning/**/*.md"]}
  rules:
    # SDP: die Spec-Straten (Vertrag/Technik/Sicht) duerfen nicht abwaerts
    # auf ADRs/Slices verweisen. ADR->Slice (Bezug-Provenance) bleibt
    # erlaubt — die ADR-Lineage-/Slice-Kante ist nicht Gegenstand von 048.
    - {from: contract, to: technik, allow: false}
    - {from: contract, to: sicht, allow: false}
    - {from: contract, to: adr, allow: false}
    - {from: contract, to: slice, allow: false}
    - {from: technik, to: sicht, allow: false}
    - {from: technik, to: adr, allow: false}
    - {from: technik, to: slice, allow: false}
    - {from: sicht, to: adr, allow: false}
    - {from: sicht, to: slice, allow: false}
  status:
    forbidden: [superseded, deprecated]
    # d-check v0.11.0 (Trigger 050): Supersede-Lineage-Carve-out — die
    # abloesende ADR darf ihre abgeloeste ADR verlinken, wenn ein
    # Supersede-Feld (`Supersedes`/`Aenderungstyp`) das Ziel nennt. Alle
    # anderen Verweise auf inaktive Dokumente bleiben `matrix-inactive`.
    allow-supersede-lineage: true
    supersede-fields: [Supersedes, Aenderungstyp]
  # SDP Regel 5 (Body vs. Changelog): ADR-/Slice-Provenance lebt nur unter
  # einer Historie-Sektion — diese Ueberschriften sind vom Richtungs-Gate
  # ausgenommen.
  exclude-sections:
    # §27-Traceability ist nach docs/plan/traceability.md ausgelagert (Slice 063);
    # verbleibend nur die architektur-internen Traceability-/Offen-Punkte-Sektionen.
    - "18. Rueckverfolgbarkeit Architektur ↔ Lastenheft"
    - "19. Offene architektonische Punkte"

# Requirements Traceability Matrix (--trace / make doc-trace, seit d-check v0.40.0
# konfigurierbar). KEIN Modul — steuert nur --trace/--require-complete, nicht das
# docs-check-Gate; rein advisory (kein Hard-Gate, siehe unten). grid-gym weicht von
# d-checks -FA-/-QA-Default ab (zweistufiges Schema GG-<FAMILIE>-NNN) und von der
# slice-<n>-Dateikonvention (hier NNN-titel.md).
#
# id-pattern = explizite Allow-List der FUNKTIONALEN/Produkt-Familien (RE2 kennt kein
# negatives Lookahead). Drei Klassen sind bewusst AUSGENOMMEN (Abdeckung lebt jeweils
# in traceability.md, nicht als slice/wave-"geliefertes" Feature):
#   1) SCOPE/DEFINITORISCH (= exakt die §27.1.1-Familien „ohne Design-Artefakt"):
#      GG-TERM (Glossar/Normbegriffe), GG-SEED (Seed-Konvention), GG-MVP (Scope-
#      Roll-up; Auspraegung lebt in einzelnen GG-SIM/DEV/…-IDs), GG-NONGOAL
#      ("ist KEIN …"), GG-FUTURE ("KANN …", optionale Zukunft) — keine Leaf-Anforderungen.
#   2) ARCHITEKTUR/DESIGN-META — GG-ARCH, GG-ARCHTEST, GG-PRINC, GG-CC: "wie gebaut"-
#      Requirements, strukturell via arch-check/lint erzwungen, auf GG-AR-* gemappt.
#   3) TEST/QUALITAET/GATE-INFRA — GG-TEST, GG-TESTTYPE, GG-QG, GG-COV, GG-QA: "wie
#      verifiziert" — via CI-Gates/Test-Suites/Make-Targets erfuellt, in traceability.md
#      auf make-Targets/GG-AR-TEST-001 gemappt. (GG-CICD + GG-TRACE bleiben BEWUSST
#      drin: GG-CICD = reale Pipeline-Features, slice/wave-geliefert; GG-TRACE = die
#      RTM-Pflege selbst, aber mit echtem Deliverable docs/plan/traceability.md
#      (Slice 063/066), slice-gemappt — beides keine reinen Meta-Ausschluss-Kandidaten.)
# Das id-pattern erfasst damit die FUNKTIONALEN/Produkt-Familien. Neue solche hier ergaenzen. Advisory-Nutzung: `make doc-trace` on-demand; Rest-Waisen (Requirements
# ohne Slice-/Wellen-Nennung, aber via ADR/traceability.md-Bereiche/Gates abgedeckt)
# sind sichtbar, brechen aber nichts. `make doc-complete` (--require-complete) bewusst
# NICHT verdrahtet. Kuratierte Quelle bleibt docs/plan/traceability.md.
trace:
  requirements:
    source: spec/lastenheft.md
    id-pattern: 'GG-(ACCEPT|AGENT|API|BESS|CICD|DATA|DEMO|DEPLOY|DEV|DNP3|FAULT|GRID|IEC|LWM2M|MODB|MQTT|OPCUA|OTEL|PERSIST|REPLAY|RT|SAFE|SCN|SIM|SNMP|TRACE|UI)-\d{3}'
  adrs:
    dir: docs/plan/adr
    file-pattern: '^(\d{4})-.*\.md$'
    id-prefix: 'ADR-'
  slices:
    dir: docs/plan/planning
    # NNN-titel.md (Slice-Ära) UND M<n>-... (eingefrorene M1..M8-Wellen im
    # done-archive) zaehlen als Liefervehikel — sonst erscheinen ~70 wave-
    # gelieferte Requirements faelschlich als Waisen. Owner-Label: 'Slice 061'
    # bzw. 'Slice M6' (Welle-M6-Lieferung; advisory, Welle != Slice bleibt in
    # der Roadmap/ADR 0072 dokumentiert).
    file-pattern: '^(M\d+|\d+)-.*\.md$'
    id-prefix: 'Slice '
  # Kuratierte Coverage-Quelle (d-check v0.41.0, DC-FA-COV-*): die kuratierten
  # Design-(§27.1)/Test-(§27.3)-Mappings in docs/plan/traceability.md zaehlen
  # range-aware (`GG-SIM-001..004` -> alle vier) als Abdeckung in EIGENER RTM-Spalte
  # (Owner 'Trace') — keine ADR-Kontamination (explizite Datei, kein dir/pattern).
  # NUR die zwei Tabellen-Sektionen sind Coverage-Quelle (`sections`-Whitelist statt
  # bloss §27.1.1-Blacklist, Review-F5): Intro/Praembeln zaehlen NICHT — sonst gaelte
  # eine narrative ID-Erwaehnung faelschlich als abgedeckt (coverage ist nicht
  # backtick-/code-span-aware). §27.1.1 (design-artefaktlos) bleibt zusaetzlich raus.
  # HINWEIS (Review-N1): `orphans=0` bezeugt Design-/Coverage-Mapping, NICHT Lieferung —
  # viele Requirements haben §27.1-Design-Coverage, aber keine Slice-/Wellen-Lieferung
  # (z. B. GG-FAULT-002..010 unimplementiert) und sind dennoch non-orphan. Der menschen-
  # sichtbare Vorbehalt lebt in docs/plan/traceability.md (Intro). Ein Requirement ist
  # Waise nur ohne Slice/Welle UND ohne Coverage. (§27.2 „Impl/Status" wurde in Slice 066 an `make doc-trace` delegiert.)
  coverage:
    - files: [docs/plan/traceability.md]
      label: Trace
      ranges: true
      sections: ["27.1 Anforderung zu Design", "27.3 Anforderung zu Test"]
      exclude-sections: ["27.1.1 Anforderungen ohne Design-Artefakt"]

# targets (Trigger 068, Tranche C1): Deklarations-Konsistenz Doku ↔ Build-Targets.
# KEIN modules:-Eintrag (hermetisches, separates Gate) — via `make doc-targets`
# aufgerufen und ans lokale `docs-check`-Gate gehaengt (docs-check laeuft nicht in
# GitHub-CI, sondern im Handoff-Stop-Hook, ADR 0071).
# C1 = nur Richtung 1 (`gate-phantom`): jede in AGENTS.md / harness/README.md
# dokumentierte `make X`-Regel existiert im Makefile. Richtung 2 (`gate-undocumented`,
# via `authority:`) ist BEWUSST WEGGELASSEN — sie findet 38 undokumentierte
# (meist Utility-)Makefile-Regeln (`clean`, `sbom`, …); deren Dokumentation/Exempt
# ist Tranche C1b im Trigger 068. Die `doc-*`-Regeln aus `include d-check.mk` liegen
# ausserhalb `makefiles:` und werden nicht geprueft (via `make doc-help` dokumentiert).
targets:
  makefiles: [Makefile]
  doc-tables: [AGENTS.md, harness/README.md]
