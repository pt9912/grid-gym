# d-migrate Neutral-Schema fuer die grid-gym Persistenz-Tabellen.
#
# Quelle-der-Wahrheit fuer die DDL bleiben die Alembic-Migrationen
# (`src/grid_gym/adapters/driven/persistence_postgres/migrations/`).
# Diese Datei spiegelt deren Ist-Stand im neutralen d-migrate-Format
# (siehe /Development/d-migrate/spec/schema-reference.md), damit daraus
# dialektspezifische DDL (PostgreSQL/MySQL/SQLite) generiert werden
# kann (`d-migrate schema generate`).
#
# Tabellen:
#   - runs              (Alembic 0001, M1-Welle-6c; Lauf-Metadaten, GG-PERSIST-003 / GG-TERM-003;
#                        + replay_of via Alembic 0003, Slice 039 / ADR 0068;
#                        + GG-TERM-Vollfelder via Alembic 0004, Slice 038 / ADR 0073)
#   - telemetry_points  (Alembic 0002, M7-Welle-1a / ADR 0047; Telemetrie-Zeitreihen, GG-PERSIST-001)
#
# Welle 1b-a/1b-b (ADR 0048/0049) fuegen KEINE Tabelle hinzu — der
# ReplaySnapshotPort liest `telemetry_points`, der Replay-Timestamp
# wird aus `simulation_time` abgeleitet (nicht gespeichert).
#
# WICHTIG (Byte-Stabilitaet, ADR 0047 §2.4):
#   `telemetry_points.value` ist bewusst `text` (kanonisches
#   str(Decimal)) und NICHT `decimal`. Ein `decimal` → `NUMERIC`
#   wuerde die Scale normalisieren (`1.50` → `1.5`) und den
#   deterministischen Replay-Diff (GG-MVP-002) brechen.

schema_format: "1.0"
name: "grid-gym persistence"
version: "0.2.0"
description: >-
  Persistenz-Tabellen der grid-gym-Simulation: Lauf-Metadaten (runs)
  und append-only Telemetrie-Zeitreihen (telemetry_points).

tables:
  runs:
    description: >-
      Lauf-Metadaten (RunMetadata, hexagon/core/domain/run.py). Traegt
      die GG-TERM-003-Reproduzierbarkeits-Felder + die 9 Felder der
      vollen GG-TERM-002/003-Equality-Matrix des Replay-Preflights
      (scenario_hash, schema_version, seed, tick_ms, tool_version,
      platform_arch, enabled_adapters, sim_start_time, config_hash;
      Slice 038 / ADR 0073) + die persistente Replay-Bindung
      replay_of (Slice 039 / ADR 0068). Append-only; Status-Lifecycle
      haelt der In-Memory-Adapter (keine Status-Spalte in Postgres
      bis M3-Welle-6c).
    columns:
      run_id:         { type: text, description: "Lauf-ID (UUIDv4 als String)" }
      scenario_hash:  { type: text, required: true, description: "SHA-256 ueber canonical_json der Szenario-Datei" }
      schema_version: { type: text, required: true }
      seed:           { type: biginteger, required: true, description: "PRNG-Seed (GG-SIM-001)" }
      tick_ms:        { type: integer, required: true, description: "Tick-Schrittweite in ms (GG-SIM-002)" }
      started_at:     { type: text, required: true, description: "ISO-8601 Wall-Clock (heute leer befuellt)" }
      ended_at:       { type: text, required: true, description: "ISO-8601 Wall-Clock (heute leer befuellt)" }
      tool_version:   { type: text, required: true }
      replay_of:      { type: text, description: "Referenz-Lauf der Replay-Bindung; NULL = regulaerer Lauf (Slice 039 / ADR 0068, Alembic 0003)" }
      platform_arch:  { type: text, required: true, description: "Normalisierte Plattformarchitektur (trim+lowercase); '' = fehlend -> Preflight-missing-Reject (ADR 0073 §2.5/§2.6, Alembic 0004)" }
      enabled_adapters: { type: text, required: true, description: "Kanonisches Adapter-Profil, komma-separiert + lexikografisch sortiert; '' = fehlend (ADR 0073 §2.3, Alembic 0004)" }
      sim_start_time: { type: biginteger, required: true, description: "Startzeit im Simulationszeitmodell in ms; heute Konstante 0 (ADR 0073 §2.2, Alembic 0004)" }
      config_hash:    { type: text, required: true, description: "SHA-256 ueber canonical_json der versionierten ConfigView v1; '' = fehlend (ADR 0073 §2.4, Alembic 0004)" }
    primary_key: [run_id]

  telemetry_points:
    description: >-
      Append-only Telemetrie-Zeitreihen (TelemetryPoint,
      hexagon/core/domain/telemetry.py; GG-PERSIST-001 / GG-DATA-001).
      Surrogat-`id` (Identity) ist Primary Key, weil
      (run_id, simulation_time, sequence) NICHT eindeutig ist
      (`sequence` ist per-device-per-tick). `read_ordered` reproduziert
      die deterministische Emissions-Reihenfolge ueber ORDER BY id.
    columns:
      id:
        type: biginteger
        description: "Surrogat-PK; aufsteigend = Insertion-/Emissions-Reihenfolge"
        generation:
          type: identity
          mode: always
      run_id:          { type: text, required: true, description: "Lauf-Scope (FK-Semantik zu runs.run_id, kein harter FK)" }
      tick:            { type: integer, required: true, description: "0-basierte Tick-Nummer" }
      simulation_time: { type: biginteger, required: true, description: "Simulationszeit in ms ab Lauf-Start" }
      device_id:       { type: text, required: true }
      metric:          { type: text, required: true }
      value:           { type: text, required: true, description: "kanonisches str(Decimal); TEXT NICHT NUMERIC (Byte-Stabilitaet, ADR 0047 §2.4)" }
      unit:            { type: text, required: true }
      quality:         { type: text, required: true, description: "Quality-StrEnum-Wert (valid/stale/...); plain TEXT, kein CHECK in der Ist-DDL" }
      source:          { type: text, required: true, description: "emittierendes Modul (z. B. battery.bess01)" }
      sequence:        { type: integer, required: true, description: "Per-Device-Tie-Break-Counter pro Tick" }
    primary_key: [id]
    indices:
      - name: ix_telemetry_points_run_id_id
        columns: [run_id, id]
        type: btree
        description: "Lese-Index fuer read_ordered(run_id): WHERE run_id ORDER BY id"
