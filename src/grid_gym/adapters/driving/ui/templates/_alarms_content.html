<section class="alarms" data-run-id="{{ run_id }}">
    <h1>Alarms — {{ run_id }}</h1>

    <table class="alarms-table">
        <thead>
            <tr>
                <th>Zeit (ms)</th>
                <th>Ziel</th>
                <th>Schweregrad</th>
                <th>Code</th>
                <th>Nachricht</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="alarms-tbody"
               hx-get="/runs/{{ run_id }}/alarms-history?limit=50"
               hx-trigger="load"
               hx-swap="innerHTML">
            <tr><td colspan="6" class="empty">Loading alarms...</td></tr>
        </tbody>
    </table>

    <div hx-ext="ws" ws-connect="/runs/{{ run_id }}/alarms-stream"
         id="alarms-ws" class="ws-bridge" aria-hidden="true"></div>

    <script>
    (function () {
        const MAX_ROWS = 200;
        const ALLOWED_SEVERITIES = ["info", "warning", "critical"];
        const runId = {{ run_id|tojson }};
        const tbody = document.getElementById("alarms-tbody");
        const wsBridge = document.getElementById("alarms-ws");
        let emptyRowRemoved = false;

        function makeCell(cls, value) {
            const td = document.createElement("td");
            td.className = cls;
            td.textContent = value == null ? "" : String(value);
            return td;
        }

        function safeSeverity(value) {
            return ALLOWED_SEVERITIES.includes(value) ? value : "info";
        }

        function renderAlarmRow(alarm) {
            const severity = safeSeverity(alarm.severity);
            const row = document.createElement("tr");
            row.className = "severity-" + severity;
            row.appendChild(makeCell("sim-time", alarm.simulation_time_ms));
            row.appendChild(makeCell("target", alarm.target));
            const sevCell = document.createElement("td");
            sevCell.className = "severity";
            const badge = document.createElement("span");
            badge.className = "severity-badge severity-" + severity;
            badge.textContent = severity;
            sevCell.appendChild(badge);
            row.appendChild(sevCell);
            row.appendChild(makeCell("code", alarm.code));
            row.appendChild(makeCell("message", alarm.message));
            row.appendChild(makeCell("status", alarm.status));
            return row;
        }

        function renderEmptyRow(label) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.colSpan = 6;
            cell.className = "empty";
            cell.textContent = label;
            row.appendChild(cell);
            return row;
        }

        function tbodyHtmlOf(nodes) {
            const tmp = document.createElement("tbody");
            for (const node of nodes) {
                tmp.appendChild(node);
            }
            return tmp.innerHTML;
        }

        function prependAlarm(alarm) {
            if (!emptyRowRemoved) {
                tbody.innerHTML = "";
                emptyRowRemoved = true;
            }
            tbody.insertBefore(renderAlarmRow(alarm), tbody.firstChild);
            while (tbody.children.length > MAX_ROWS) {
                tbody.removeChild(tbody.lastChild);
            }
        }

        document.body.addEventListener("htmx:beforeSwap", function (event) {
            const target = event.detail.target;
            if (!target || target.id !== "alarms-tbody") {
                return;
            }
            const xhr = event.detail.xhr;
            if (xhr && xhr.status >= 400) {
                event.detail.serverResponse = tbodyHtmlOf([
                    renderEmptyRow("Failed to load alarms (HTTP " + xhr.status + ").")
                ]);
                emptyRowRemoved = false;
                return;
            }
            let payload;
            try {
                payload = JSON.parse(event.detail.serverResponse);
            } catch (err) {
                event.detail.serverResponse = tbodyHtmlOf([
                    renderEmptyRow("Failed to parse alarms response.")
                ]);
                emptyRowRemoved = false;
                return;
            }
            const alarms = Array.isArray(payload && payload.alarms) ? payload.alarms : null;
            if (alarms === null) {
                event.detail.serverResponse = tbodyHtmlOf([
                    renderEmptyRow("Unexpected alarms response shape.")
                ]);
                emptyRowRemoved = false;
                return;
            }
            if (alarms.length === 0) {
                event.detail.serverResponse = tbodyHtmlOf([
                    renderEmptyRow("No alarms yet.")
                ]);
                emptyRowRemoved = false;
                return;
            }
            const rows = alarms.map(renderAlarmRow);
            event.detail.serverResponse = tbodyHtmlOf(rows);
            emptyRowRemoved = true;
        });

        wsBridge.addEventListener("htmx:wsAfterMessage", function (event) {
            let alarm;
            try {
                alarm = JSON.parse(event.detail.message);
            } catch (err) {
                return;
            }
            if (alarm.run_id !== runId) {
                return;
            }
            prependAlarm(alarm);
        });
    })();
    </script>
</section>
