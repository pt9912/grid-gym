<section class="system" data-run-id="{{ run_id }}">
    <h1>System Status — {{ run_id }}</h1>

    <p class="page-intro">
        Welle-6b (Decision 22): Simulationszustands-Dashboard.
        Run-Status pollt `GET /runs/{{ run_id }}/status` jede
        Sekunde; Service-Health pollt `GET /health` alle 5s.
    </p>

    <h2>Run Status</h2>
    <div id="system-run-status"
         class="run-status"
         hx-get="/runs/{{ run_id }}/status"
         hx-trigger="every 1s"
         hx-target="this"
         hx-swap="innerHTML">
        <p class="status-line">Loading run status...</p>
    </div>

    <h2>Service Health</h2>
    <div id="system-service-health"
         class="service-health"
         hx-get="/health"
         hx-trigger="every 5s"
         hx-target="this"
         hx-swap="innerHTML">
        <p class="status-line">Loading service health...</p>
    </div>

    <script>
    (function () {
        // Welle-6b-Decision-22: Inline-JS rendert die JSON-Antworten
        // beider Polling-Bloecke. Idempotenz-Guard analog Welle-4a-
        // Control + Welle-6a-Faults.
        if (document.body.dataset.systemPageListenersAttached === "true") {
            return;
        }
        document.body.dataset.systemPageListenersAttached = "true";

        // Welle-6b-Review F1/F4/F7: DOM-API statt String-Concat —
        // escape-by-construction + Null-Guards + String-Coerce.
        function renderRunStatus(payload) {
            const p = document.createElement("p");
            p.className = "status-line";
            if (!payload || payload.state === undefined) {
                p.textContent = "Run status unavailable.";
                p.dataset.errorState = "true";
                return p.outerHTML;
            }
            const stateStr = String(payload.state);
            const stateSpan = document.createElement("span");
            stateSpan.className = "run-state state-" + stateStr;
            stateSpan.textContent = stateStr;
            p.appendChild(stateSpan);
            p.appendChild(document.createTextNode(" · "));
            const simSpan = document.createElement("span");
            simSpan.className = "sim-time";
            const simRaw = payload.simulation_time;
            const simStr = simRaw === undefined || simRaw === null
                ? "—"
                : String(simRaw);
            simSpan.textContent = "sim time: " + simStr + " ms";
            p.appendChild(simSpan);
            p.appendChild(document.createTextNode(" · "));
            const tickSpan = document.createElement("span");
            tickSpan.className = "tick-count";
            const tickRaw = payload.tick_count;
            const tickStr = tickRaw === undefined || tickRaw === null
                ? "—"
                : String(tickRaw);
            tickSpan.textContent = "ticks: " + tickStr;
            p.appendChild(tickSpan);
            return p.outerHTML;
        }

        function renderServiceHealth(payload) {
            const p = document.createElement("p");
            p.className = "status-line";
            const status = payload && payload.status !== undefined
                ? String(payload.status)  // F7: coerce to string before .toUpperCase()
                : "unknown";
            const label = status === "ok" ? "OK" : status.toUpperCase();
            const span = document.createElement("span");
            span.className = "service-status status-" + status;
            span.textContent = "Service: " + label;
            p.appendChild(span);
            return p.outerHTML;
        }

        function renderError(targetId, message) {
            const p = document.createElement("p");
            p.className = "status-line error";
            p.dataset.errorState = "true";
            p.textContent = message;
            return p.outerHTML;
        }

        document.body.addEventListener("htmx:beforeSwap", function (event) {
            if (!event.detail || !event.detail.target) {
                return;
            }
            const target = event.detail.target;
            if (target.id !== "system-run-status" && target.id !== "system-service-health") {
                return;
            }
            let payload;
            try {
                payload = JSON.parse(event.detail.serverResponse);
            } catch (err) {
                event.detail.serverResponse = renderError(
                    target.id, target.id + " payload could not be parsed."
                );
                return;
            }
            if (target.id === "system-run-status") {
                event.detail.serverResponse = renderRunStatus(payload);
                return;
            }
            if (target.id === "system-service-health") {
                event.detail.serverResponse = renderServiceHealth(payload);
                return;
            }
        });
    })();
    </script>
</section>
