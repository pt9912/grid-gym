<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}grid-gym{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
    <!-- HTMX-WebSocket-Extension: in HTMX 2.x aus dem Core ausgelagert; ohne sie
         tut `hx-ext="ws"` nichts (Dashboard-/Alarms-Live-Feed blieb „Waiting for
         live data"). `defer` erhaelt die Reihenfolge (nach htmx.min.js). -->
    <script src="/static/htmx-ext-ws.min.js" defer></script>
    <script src="/static/chart.umd.min.js" defer></script>
</head>
<body>
    <div class="sim-banner" role="note" aria-label="Simulation-only disclaimer">
        Simulation only — not approved for production grid control.
        Nur Simulation — nicht fuer produktive Anlagensteuerung freigegeben.
    </div>
    <header>
        {% include "navigation.html" %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
